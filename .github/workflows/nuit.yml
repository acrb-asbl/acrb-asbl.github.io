# NUIT : robot universel (lecture seule, contrôle de santé avant de commencer), porte sur le site en ligne,
# mesure de la valeur, puis chaque rouge devient une tâche de correction (ticket).
name: nuit
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nuit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.63.0-${{ runner.os }}
      - name: Outils de test (3 essais de 5 min, jamais bloqué)
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            timeout 300 bash -c 'npm i --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium webkit' && exit 0
            echo "essai $i bloqué ou en échec, nouvel essai"; sleep 5
          done
          exit 1
      - name: Robot universel (vrais boutons, lecture seule)
        run: node .porte/robot-universel.mjs https://acrb-asbl.github.io/acrb sortie/robot 40 20 "Pixel 7"
        continue-on-error: true
      - name: Porte sur le site en ligne
        run: node .porte/porte.mjs https://acrb-asbl.github.io sortie/porte
        continue-on-error: true
      - name: Valeur du jour
        run: node .porte/valeur.mjs sortie
        continue-on-error: true
      - name: File de corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .porte/file.mjs sortie
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuit-${{ github.run_id }}
          path: sortie
          retention-days: 14
