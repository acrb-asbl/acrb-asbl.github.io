# NUIT : robot universel (lecture seule, contrôle de santé avant de commencer), porte sur le site en ligne,
# mesure de la valeur, puis chaque rouge devient une tâche de correction (ticket).
name: nuit
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  nuit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: "Outils de test (navigateurs déjà dans l'image Playwright officielle, aucune installation système)"
        timeout-minutes: 5
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm i --no-save --no-package-lock playwright@1.63.0
      - name: Robot universel (vrais boutons, lecture seule)
        run: node .porte/robot-universel.mjs https://acrb-asbl.github.io/acrb sortie/robot 40 20 "Pixel 7"
        continue-on-error: true
      - name: Porte sur le site en ligne
        run: node .porte/porte.mjs https://acrb-asbl.github.io sortie/porte
        continue-on-error: true
      - name: Valeur du jour
        run: node .porte/valeur.mjs sortie
        continue-on-error: true
      - name: File de corrections
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .porte/file.mjs sortie
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuit-${{ github.run_id }}
          path: sortie
          retention-days: 14
