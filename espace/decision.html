<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Décision écrite — ACRB</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>:root{--navy:#14233c;--line:#dfe3ea;--muted:#5f6675;--green:#1f8a4c;--rouge:#af4057}*{box-sizing:border-box}body{margin:0;background:#f4f5f8;color:#222;font:17px/1.55 "Source Sans 3","Segoe UI",Arial,sans-serif}
.hd{background:#fff;border-bottom:3px solid var(--rouge);padding:12px 16px;display:flex;gap:12px;align-items:center}.hd img{height:54px;width:auto}.hd b{display:block;font:800 15px "Libre Franklin",Arial,sans-serif;color:var(--rouge);line-height:1.25}.hd span{font-size:13px;color:var(--rouge);font-style:italic}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}h1{font:800 clamp(22px,4vw,30px)/1.15 "Libre Franklin",Arial,sans-serif;margin:0 0 6px;color:var(--navy)}.lead{color:var(--muted);margin:0 0 16px;font-size:15.5px}
.pt{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rouge);padding:14px 16px;margin:10px 0}.pt h2{font:800 16.5px "Libre Franklin",Arial,sans-serif;margin:0 0 6px}.pt .dec{background:#fbf6f7;border:1px solid #ecd6dc;padding:10px 12px;margin-top:8px;white-space:pre-wrap}.pt .ex{color:#3b4150;white-space:pre-wrap}
.box{background:#fff;border:1px solid var(--line);padding:16px;margin-top:16px}.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:0 0 14px}.chk input{margin-top:5px;width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{font:700 16px "Libre Franklin",Arial,sans-serif;padding:13px 18px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;flex:1 1 200px}.row button.p{background:var(--green);border-color:var(--green);color:#fff}.row button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:15.5px;font-weight:600}.ok{background:#e4f3ea;color:#174d2c;padding:16px;border:1px solid #bfe3cc}.ko{background:#fbe9e6;color:#8f2a1e;padding:16px;border:1px solid #f0c7c0}.err{color:#b23a2b}.law{font-size:13px;color:var(--muted);margin-top:14px}</style></head><body>
<div class="hd"><img src="img/acrb-logo.png" alt="Logo de l'ACRB"><div><b>Association des Commerçants des rues de Brabant, Liedts et Gallait</b><span>Ensemble pour mieux réussir</span></div></div>
<div class="wrap"><h1 id="titre">Décision écrite</h1><p class="lead" id="lead">Chargement…</p><div id="pts"></div><div id="zone"></div>
<p class="law" id="law"></p></div>
<script>
(function(){var SB="https://movoukcjirtjnqjgwndw.supabase.co",KEY="sb_publishable_jVXX4nAfC5F0wzj_FedaAQ_WhzzN_O6",t=new URLSearchParams(location.search).get("t")||"";
function rpc(n,b){return fetch(SB+"/rest/v1/rpc/"+n,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.message||d.hint||"erreur");return d;});});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dl(s){if(!s)return "";var p=String(s).slice(0,10).split("-");return (+p[2])+" "+["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][+p[1]-1]+" "+p[0];}
function dh(s){var d=new Date(s);return d.toLocaleDateString("fr-BE")+" à "+d.toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"});}
var lead=document.getElementById("lead"),zone=document.getElementById("zone");
if(!t){lead.textContent="Lien incomplet : demandez un nouveau lien à l'association.";return;}
rpc("acrb_avis_lire",{p_jeton:t}).then(function(d){var ca=d.type==="ecrite_ca";
  document.getElementById("titre").textContent=ca?"Décision écrite du conseil d'administration":"Décision écrite des membres";
  lead.innerHTML="Bonjour <b>"+esc(d.nom)+"</b>. Référence "+esc(d.numero)+". Le conseil vous propose d'adopter la décision ci-dessous sans réunion. Elle n'est acquise que si chacun"+(ca?" des administrateurs":" des membres effectifs")+" l'approuve. Réponse attendue au plus tard le <b>"+esc(dl(d.date_limite))+"</b>.";
  document.getElementById("law").textContent=ca?"Code des sociétés et des associations, art. 9:9 : les décisions de l'organe d'administration peuvent être prises par écrit, à l'unanimité des administrateurs.":"Code des sociétés et des associations, art. 9:14/1 : les membres peuvent prendre à l'unanimité et par écrit toutes les décisions de l'assemblée générale, sauf la modification des statuts.";
  document.getElementById("pts").innerHTML=(d.expose?'<p class="ex">'+esc(d.expose)+'</p>':'')+(d.points||[]).map(function(p,i){return '<div class="pt"><h2>'+(i+1)+". "+esc(p.titre)+'</h2>'+(p.expose?'<div class="ex">'+esc(p.expose)+'</div>':'')+'<div class="dec">'+esc(p.decision)+'</div></div>';}).join("");
  if(d.reponse){zone.innerHTML='<div class="msg '+(d.reponse==="approuve"?"ok":"ko")+'">Votre réponse est enregistrée depuis le '+esc(dh(d.repondu_le))+' : '+(d.reponse==="approuve"?"vous approuvez":"vous n'approuvez pas")+' ce texte. Merci.</div>';return;}
  if(d.statut==="pv_signe"||d.statut==="annulee"){zone.innerHTML='<div class="msg ko">Cette décision est close.</div>';return;}
  zone.innerHTML='<div class="box"><label class="chk"><input type="checkbox" id="lu"><span>Je soussigné(e) <b>'+esc(d.nom)+'</b> déclare avoir lu l’intégralité du texte ci-dessus. Ma réponse, horodatée et conservée par l’association, tient lieu de signature.</span></label><div class="row"><button type="button" class="p" id="oui" disabled>J’approuve</button><button type="button" id="non" disabled>Je n’approuve pas</button></div><div class="msg" id="m"></div></div>';
  var lu=document.getElementById("lu"),oui=document.getElementById("oui"),non=document.getElementById("non"),m=document.getElementById("m");
  lu.onchange=function(){oui.disabled=non.disabled=!lu.checked;};
  function rep(v){oui.disabled=non.disabled=true;m.className="msg";m.textContent="Enregistrement…";
    rpc("acrb_avis_repondre",{p_jeton:t,p_reponse:v,p_user_agent:navigator.userAgent}).then(function(){zone.innerHTML='<div class="msg '+(v==="approuve"?"ok":"ko")+'">Merci, '+esc(d.nom)+'. Votre réponse est enregistrée : '+(v==="approuve"?"vous approuvez":"vous n'approuvez pas")+' ce texte. L’association vous communiquera le résultat.</div>';})
    .catch(function(e){m.className="msg err";m.textContent="Non enregistré : "+e.message;oui.disabled=non.disabled=!lu.checked;});}
  oui.onclick=function(){rep("approuve");};non.onclick=function(){rep("refuse");};
}).catch(function(e){lead.textContent=e.message;});})();
</script><script src="signaler.js?v=4" defer></script></body></html>
