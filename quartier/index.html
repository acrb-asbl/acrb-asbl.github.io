  var pr=document.getElementById("prior"),sel=Array.prototype.map.call(pr.querySelectorAll("input:checked"),function(i){return i.value;});pr.innerHTML=Object.keys(T.prior).map(function(k){return '<label'+(sel.indexOf(k)>=0?' class="on"':'')+'><input type="checkbox" name="prior" value="'+k+'"'+(sel.indexOf(k)>=0?' checked':'')+'>'+esc(T.prior[k])+'</label>';}).join("");pr.querySelectorAll("input").forEach(function(i){i.onchange=function(){i.parentNode.classList.toggle("on",i.checked);};});
  document.getElementById("sg_rub").innerHTML=Object.keys(T.rub).map(function(k){return '<option value="'+k+'">'+esc(T.rub[k])+'</option>';}).join("");
  renderChips();render();}
function renderChips(){var rubs=Object.keys(T.rub).filter(function(r){return ROWS.some(function(p){return p.rubrique===r;});});document.getElementById("chips").innerHTML='<button data-r="" class="'+(FIL===""?"on":"")+'">'+esc(T.filtre_tous)+'</button>'+rubs.map(function(r){return '<button data-r="'+r+'" class="'+(FIL===r?"on":"")+'">'+esc(T.rub[r])+'</button>';}).join("");document.querySelectorAll("#chips button").forEach(function(b){b.onclick=function(){FIL=b.dataset.r;renderChips();render();};});}
function render(){var rows=ROWS.filter(function(p){return !FIL||p.rubrique===FIL;}),box=document.getElementById("weeks");if(!rows.length){box.innerHTML='<p class="note">'+esc(T.vide)+'</p>';return;}
  var groups={},order=[];rows.forEach(function(p){var k=weekKey(p.date_fait||p.publie_le);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(p);});
  box.innerHTML=order.map(function(k){var s=pd(k);return '<div class="week"><h3>'+esc(L==="nl"?"Week van ":"Semaine du ")+esc(fmt(s))+'</h3><div class="posts">'+groups[k].map(post).join("")+'</div></div>';}).join("");}
function post(p){var u=p.source_url;return '<article class="post"><div class="meta"><span class="r">'+esc(T.rub[p.rubrique]||p.rubrique)+'</span>'+(p.date_fait?'<span>'+esc(fmt(p.date_fait))+'</span>':'')+(p.lieu?'<span>'+esc(p.lieu)+'</span>':'')+'</div><h4>'+esc(tx(p.titre))+'</h4><p>'+esc(tx(p.corps))+'</p><div class="src">'+esc(T.type[p.source_type]||"")+(p.source_nom?' · '+esc(p.source_nom):'')+(u?' · <a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(T.lire)+'</a>':'')+'</div></article>';}
function setLang(l){L=I18N[l]?l:"fr";T=I18N[L];try{localStorage.setItem("acrb_site_lang",L);}catch(e){}applyLang();}
document.querySelectorAll("[data-l]").forEach(function(a){a.onclick=function(e){e.preventDefault();setLang(a.dataset.l);};});
var q=new URLSearchParams(location.search).get("lang"),saved=null;try{saved=localStorage.getItem("acrb_site_lang");}catch(e){}var nv=(navigator.language||"fr").slice(0,2);setLang(q||saved||(nv==="nl"?"nl":"fr"));
fetch(SB+"/rest/v1/acrb_quartier_public?select=*",{headers:H}).then(function(r){return r.ok?r.json():[];}).then(function(rows){ROWS=rows;renderChips();render();}).catch(function(){});
fetch(SB+"/rest/v1/rpc/acrb_quartier_stats",{method:"POST",headers:H,body:"{}"}).then(function(r){return r.ok?r.json():null;}).then(function(s){if(!s)return;document.getElementById("k_breves").textContent=s.breves;document.getElementById("k_semaine").textContent=s.semaine;document.getElementById("k_riverains").textContent=s.riverains;document.getElementById("k_sign").textContent=s.signalements_traites;}).catch(function(){});
function rpc(name,body){return fetch(SB+"/rest/v1/rpc/"+name,{method:"POST",headers:H,body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||j.hint||r.status);return j;});});}
document.getElementById("frj").onsubmit=function(e){e.preventDefault();var f=e.target,m=document.getElementById("rj_msg"),b=f.querySelector("button");b.disabled=true;m.className="note";m.textContent="…";
  var pr=Array.prototype.map.call(f.querySelectorAll('input[name=prior]:checked'),function(i){return i.value;});
  rpc("acrb_riverain_adherer",{p:{nom:f.nom.value,email:f.email.value,tel:f.tel.value,rue:f.rue.value,profil:f.profil.value,priorites:pr,message:f.message.value,participer:f.participer.checked,langue:L,user_agent:navigator.userAgent}}).then(function(){m.className="note ok";m.textContent=T.f_ok;f.reset();f.querySelectorAll(".pr label").forEach(function(l){l.classList.remove("on");});}).catch(function(err){m.className="note bad";m.textContent=err.message;b.disabled=false;});};
var sgm=document.getElementById("sgm");document.getElementById("sg_open").onclick=function(){sgm.classList.add("open");sgm.querySelector("input").focus();};document.getElementById("sg_close").onclick=function(){sgm.classList.remove("open");};sgm.addEventListener("click",function(e){if(e.target===sgm)sgm.classList.remove("open");});
document.getElementById("fsg").onsubmit=function(e){e.preventDefault();var f=e.target,m=document.getElementById("sg_msg"),b=f.querySelector("button");b.disabled=true;m.className="note";m.textContent="…";
  rpc("acrb_quartier_signaler",{p:{titre:f.titre.value,corps:f.corps.value,lieu:f.lieu.value,rubrique:f.rubrique.value,date_fait:f.date_fait.value,source_url:f.source_url.value,email:f.email.value,langue:L,user_agent:navigator.userAgent}}).then(function(){m.className="note ok";m.textContent=T.sg_ok;f.reset();b.disabled=false;setTimeout(function(){sgm.classList.remove("open");m.textContent="";},2500);}).catch(function(err){m.className="note bad";m.textContent=err.message;b.disabled=false;});};
</script></body></html>
