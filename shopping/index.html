.card h4{margin:0 0 2px;font:600 19px/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .cat{font:600 12px var(--display);color:var(--c);text-transform:uppercase;letter-spacing:.08em}
.card .act{font-size:13.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .who{font-size:13px;margin-top:8px}.card .who span{color:var(--muted)}
.card .st{font:600 12.5px var(--display);letter-spacing:.05em;text-transform:uppercase;margin-top:6px}.ok{color:var(--green)}.ko{color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-l);padding:3px 7px}
.card.dim{opacity:.72}.empty{color:var(--muted);padding:50px 0;text-align:center}
/* practical + asso */
.nl{margin-top:22px;padding:16px;border:1px solid var(--line);background:#fff}.nl b{display:block;font:600 17px var(--display);text-transform:uppercase;margin-bottom:8px}.nlrow{display:flex;gap:0}.nlrow input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--fg);border-right:0;font:inherit}
.pract{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.pcard{background:var(--card);padding:20px}.pgrp{grid-column:1/-1}
.pcard b{display:block;font:600 19px/1.1 var(--display);text-transform:uppercase;margin-bottom:8px}.pcard p{margin:0;color:#333;font-size:14.5px}
.asso{margin-top:20px;background:var(--bg2);color:var(--fg);padding-block:56px;border-top:1px solid var(--line)}
.asso .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}@media(max-width:780px){.asso .wrap{grid-template-columns:1fr}}
.asso h2{font:700 clamp(30px,4.5vw,44px)/1 var(--display);text-transform:uppercase;margin:8px 0 12px}
.asso p{margin:0 0 12px;font-size:16.5px;line-height:1.6;color:#333}
.box{background:var(--card);border:1px solid var(--line);padding:18px;display:grid;gap:10px;min-width:0;color:var(--fg);align-content:start}
.box h5{margin:0;font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}.kv span:first-child{color:var(--muted)}
.box.cta{background:var(--fg);color:#fff;border:0}.box.cta h5{color:rgba(255,255,255,.7)}.box.cta p{margin:0;font-size:15px;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border:1px solid var(--fg);background:#fff;color:var(--fg);text-decoration:none;font:600 15px var(--display);text-transform:uppercase;letter-spacing:.06em}
.btn.p{background:var(--fg);border-color:var(--fg);color:#fff}.btn.w{background:#fff;border-color:#fff;color:var(--fg)}.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px}
footer{padding-block:24px 60px;font-size:13px;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line)}
/* fiche commerce v2 (23/11/2026) */
.fx{--fx-r:2px;max-width:860px;margin:0 auto;padding-bottom:50px;color:var(--fg)}
html[data-vx] .fx{--fx-r:16px}
.fx-hero{position:relative;height:clamp(260px,52vw,420px);overflow:hidden;background:var(--c);color:#fff}
.fx-hero>img,.fx-hero>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fx-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0,transparent 25%,transparent 35%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.9) 100%)}
.fx-back{position:absolute;left:12px;top:12px;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;text-decoration:none;font:700 20px/1 Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.fx-illus{position:absolute;right:10px;top:16px;z-index:2;background:rgba(17,17,17,.6);color:#fff;font:600 11px/1 Arial,sans-serif;padding:4px 7px;border-radius:4px}
.fx-av{position:absolute;inset:0;display:grid;place-items:center;font:700 90px var(--display);color:#fff}
.fx-ov{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.fx-cat{display:inline-block;font:700 12px/1 var(--body);letter-spacing:.04em;padding:6px 9px;border-radius:999px;color:#fff;border:1px solid rgba(255,255,255,.5)}
.fx-ov h1{margin:8px 0 6px;font:800 clamp(28px,7vw,46px)/1.05 var(--display);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35);overflow-wrap:anywhere}
.fx-meta{font:500 14.5px/1.35 var(--body);color:#f2f2f2}.fx-meta b.ok{color:#7ee2a8}.fx-meta b.ko{color:#ffb4a8}
.fx-act{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:10px 8px;border-bottom:1px solid var(--line);background:var(--card,#fff);position:sticky;top:var(--navh,0px);z-index:20}
.fx-act a,.fx-act button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;background:none;border:0;color:var(--accent);text-decoration:none;font:600 12px/1.15 var(--body);cursor:pointer;text-align:center;min-width:0}
.fx-act svg{width:22px;height:22px;padding:9px;box-sizing:content-box;border-radius:50%;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fx-act span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--fg)}
.fx-act button[aria-pressed=true] svg{background:var(--accent);color:#fff}
.fx-body{padding:14px 16px 0;display:grid;gap:12px}
.fx-badges{display:flex;flex-wrap:wrap;gap:6px}.fx-badges span{font:600 12.5px/1 var(--body);padding:7px 10px;border-radius:999px;background:var(--bg2);color:var(--fg)}.fx-badges .g{background:var(--green-l,#e6f3ec);color:var(--green)}
.fx-sec{border:1px solid var(--line);border-radius:var(--fx-r);background:var(--card,#fff)}
.fx-sec summary,.fx-flat{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;list-style:none;font:500 15px var(--body)}
.fx-sec summary::-webkit-details-marker{display:none}.fx-sec summary:after{content:"⌄";font-size:18px;color:var(--muted)}.fx-sec[open] summary:after{content:"⌃"}.fx-flat:after{display:none}
.fx-sec summary span,.fx-flat span{color:var(--muted);margin-left:auto;text-align:right}
.fx-sec>div{padding:0 16px 14px;display:grid;gap:10px}.fx-sec ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.fx-card{border:1px solid var(--line);border-radius:var(--fx-r);background:var(--card,#fff);padding:16px;display:grid;gap:10px;min-width:0}
.fx-card h2,.fx-near h2{margin:0;font:700 17px/1.2 var(--body);text-transform:none;letter-spacing:0;color:var(--fg)}
.fx-card p{margin:0;font-size:15px;line-height:1.5}.fx-art{color:var(--muted)}
.fx-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.fx-chips span{font-size:13px;color:var(--muted);margin-right:4px}.fx-chips i{font-style:normal;font:600 13px var(--body);padding:5px 9px;border-radius:999px;background:var(--bg2)}
.fx-addr{font-weight:600}
.fx #fmap{position:relative;z-index:0;isolation:isolate;height:170px;border-radius:var(--fx-r);overflow:hidden;border:1px solid var(--line)}
.fx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:var(--fx-r);background:var(--accent);color:#fff;text-decoration:none;font:700 15px var(--body);border:0;cursor:pointer}
.fx-btn svg{width:18px;height:18px}
.fx-links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}.fx-links a{color:var(--accent)}
.fx-lnk{background:none;border:0;padding:0;color:var(--accent);font:600 14px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start}
.fx-mini summary{cursor:pointer;font-size:14px;color:var(--muted)}.fx-mini ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.fx-near{display:grid;gap:10px;min-width:0}
.fx-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}.fx-row::-webkit-scrollbar{display:none}
.fx-row a{flex:none;width:150px;scroll-snap-align:start;color:var(--fg);text-decoration:none}
.fx-th{position:relative;height:150px;border-radius:var(--fx-r);overflow:hidden;background:var(--bg2)}.fx-th>img,.fx-th>svg{width:100%;height:100%;object-fit:cover;display:block}.fx-th .fx-illus{top:6px;right:6px;font-size:9px}.fx-th .fx-av{font-size:46px}
.fx-row b{display:block;font:700 14px/1.25 var(--body);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-row span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-th .fx-illus{display:none}
.fx-help summary b{font-weight:600;color:var(--muted);font-size:14px}.fx-hb{display:grid;gap:12px}
.fx .rep{display:none;gap:8px}.fx .rep.open{display:grid}
@media(min-width:900px){.fx{padding-top:18px}.fx-hero{border-radius:var(--fx-r)}}
html[data-theme=nuit] .fx-act,html[data-theme=nuit] .fx-sec,html[data-theme=nuit] .fx-card{background:var(--card)}

s de la gare du Nord : mode, caftans, tissus, bijoux, saveurs du Maghreb et d'Orient. Des centaines de vitrines, numéro par numéro.","search_ph":"Une enseigne, un numéro, un article…","all_streets":"Toutes les rues","kpi1":"commerces avec vitrine","kpi2":"rues et places","kpi3":"fiches complétées par les commerçants","univers":"Explorer par univers","univers_sub":"Touchez un univers pour filtrer la liste.","all":"Tout","show_all":"Afficher aussi les entreprises sans vitrine (grossistes, bureaux, indépendants domiciliés)","found":"commerces","found1":"commerce","empty":"Aucun commerce ne correspond. Essayez un autre mot ou cochez « Afficher aussi les entreprises sans vitrine ».","verified":"Fiche à jour","open_now":"Ouvert","closed_now":"Fermé","until":"jusqu'à","opens":"ouvre à","resp":"Responsable","resps":"Responsables","back":"Tous les commerces","since":"Depuis","no_vitrine":"Sans vitrine","hours":"Horaires","today":"aujourd'hui","closed":"fermé","friday":"Vendredi : fermé pendant la prière","friday_open":"Vendredi : ouvert en continu","friday_var":"Vendredi : horaire variable à l'heure de la prière","summer":"heure d'été : une heure plus tard","eid":"Fermé les jours de l'Aïd al-Fitr et de l'Aïd al-Adha","eid_fitr":"Fermé le jour de l'Aïd al-Fitr","eid_adha":"Fermé le jour de l'Aïd al-Adha","other_closures":"Autres fermetures","languages":"Langues parlées","articles":"Articles","about_shop":"Présentation","contact":"Contact","phone":"Téléphone","website":"Site web","activities":"Activités déclarées","people":"Responsables","people_note":"Rôles publiés au registre des entreprises. Les noms ne s’affichent que si le gérant le choisit.","company":"Société","name":"Dénomination","form":"Forme","created":"Créée en","complete_title":"Horaires, langues, photos","complete_text":"Pas encore renseignés. Vous tenez ce commerce ? Complétez votre fiche en cinq minutes : horaires, fermetures, langues parlées, logo et photo apparaîtront ici.","complete_btn":"Compléter ma fiche","route":"Itinéraire","bce":"Fiche BCE","report":"Signaler une erreur","report_what":"Que signalez-vous ?","r1":"Ce commerce est fermé","r2":"Ce commerce a déménagé","r3":"Le nom de l'enseigne est incorrect","r4":"L'activité est incorrecte","r5":"Autre erreur","r_comment":"Précisions (facultatif)","r_contact":"Votre e-mail ou téléphone (facultatif)","send":"Envoyer","r_ok":"Merci, votre signalement est transmis à l'ACRB.","r_ko":"Envoi impossible pour l'instant.","r_choose":"Choisissez un motif.","q_title":"Un quartier, mille vitrines","q_lead":"À cinq minutes à pied de la gare de Bruxelles-Nord, la rue de Brabant et les rues voisines forment l'un des plus grands quartiers commerçants de Bruxelles, connu bien au-delà des frontières.","q1t":"Accès","q1":"Gare du Nord (trains, métro Rogier à proximité), trams et bus à la place Liedts et à la gare du Nord. Parkings aux alentours.","q2t":"Ouvert 7 jours sur 7","q2":"La plupart des commerces ouvrent du lundi au samedi vers 10 h et beaucoup le dimanche : les dimanches et jours fériés sont jours de fête dans le quartier.","q3t":"Prix et originalité","q3":"Plus de trois cents magasins, de 30 à 700 m², jusqu'à deux mille articles chacun. Une réputation bâtie depuis plus de vingt ans sur des produits introuvables ailleurs et des prix très compétitifs.","q4t":"Langues","q4":"Français, néerlandais, anglais, arabe, turc, ourdou : chaque fiche indique les langues parlées en magasin.","a_title":"L'association","a1":"L'ACRB, Association des Commerçants de la Rue de Brabant (asbl créée en 1999, n° d'entreprise 0468.701.030), réunit les commerçants, artisans et indépendants de la rue de Brabant, de la place Liedts, des rues Gallait, des Palais, Rogier, de Quatrecht et de l'avenue de la Reine, sur les communes de Schaerbeek et de Saint-Josse-ten-Noode.","a2":"Elle anime le quartier (journées commerçantes, Saint-Nicolas, fêtes de fin d'année, repas du Ramadan, Festival des Saveurs), défend les intérêts de ses membres auprès des communes, de la Région et de l'État fédéral, et travaille à un quartier plus propre, plus sûr et plus accueillant.","a_contact":"Contact","a_addr":"Adresse","a_member":"Vous êtes commerçant dans le quartier ?","a_member_text":"Mettez votre fiche à jour en cinq minutes, en français, néerlandais, anglais, turc, arabe ou ourdou : elle apparaît ici avec vos horaires, vos langues et vos photos.","foot1":"Fiches établies à partir du registre public des entreprises (SPF Économie, Banque-Carrefour des Entreprises, unités d'établissement actives relevées le 28/11/2026) et complétées par les commerçants. Les noms des responsables sont ceux publiés par la BCE.","foot2":"Une erreur, un commerce fermé ou déménagé ? Chaque fiche a un bouton « Signaler ».","cats":{"mode":"Vêtements et robes","chaussures":"Chaussures et sacs","bijoux":"Bijoux, or et montres","tissus":"Tissus et mercerie","beaute":"Coiffure et beauté","parfum":"Parfumerie et cosmétiques","alim":"Alimentation","epicerie":"Épicerie et supermarché","resto":"Restaurants et snacks","cafe":"Cafés et salons de thé","maison":"Maison et décoration","electro":"Électronique et télécom","pharma":"Pharmacie et optique","culture":"Culture, jouets et cadeaux","services":"Services et agences","gros":"Commerce de gros","batiment":"Bâtiment","transport":"Transport","sante":"Santé","info":"Informatique","immo":"Immobilier","asso":"Association","ens":"Enseignement","b2b":"Services aux entreprises","auto":"Auto et car-wash","hotel":"Hébergement","autre":"Autres activités","autres_com":"Autres commerces","bazar":"Bazar et discount","tabac":"Tabac et presse"},"roles":{"gerant":"Gérant·e","admin":"Administrateur·rice","admindel":"Administrateur délégué","indep":"Indépendant·e","rep":"Représentant permanent","assoc":"Associé·e","pres":"Président·e","autre":"Responsable"},"days":["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],"communes":{"1030":"Schaerbeek","1210":"Saint-Josse-ten-Noode","1000":"Bruxelles"},"open_now_f":"Ouvert maintenant","near":"Près de moi","near_err":"Position indisponible","map":"La carte","map_sub":"Chaque numéro à sa place. Touchez un point pour ouvrir la fiche.","walk":"La balade","walk_sub":"La rue de Brabant en trois dimensions, de la gare du Nord à la place Liedts : chaque façade est un commerce réel, à sa vraie place, face à son vrai vis-à-vis.","featured":"À la une","featured_sub":"Les commerces qui ont complété leur fiche : horaires, langues, photos.","m":"m","dist":"à","list_title":"Tous les commerces","nav_map":"Carte","nav_walk":"Balade","practical":"Infos pratiques","p1t":"Venir en train : la première gare du pays","p1":"Bruxelles-Nord est la gare la plus fréquentée de Belgique : 61 362 voyageurs par jour de semaine (SNCB, 2025). La rue de Brabant commence à 5 minutes à pied de la sortie rue d'Aerschot. Trains IC et S, bus De Lijn et STIB, métro Rogier à 10 minutes.","p2t":"Se garer : Interparking Brabant – Gare du Nord","p2":"Rue de Quatrecht 38, au cœur du quartier : 158 places dont 5 PMR, ouvert 24 h/24, 6 bornes de recharge électrique, hauteur 2 m. D'autres parkings publics autour de la gare du Nord et de la place Rogier.","p3t":"Quand venir","p3":"Du lundi au samedi dès 10 h ; beaucoup de commerces ouvrent aussi le dimanche. Le vendredi, certains ferment pendant la prière (vers 13 h). Les fêtes de fin d'année et les journées commerçantes du printemps sont les grands rendez-vous.","p4t":"Le quartier Nord, à deux pas","p4":"Derrière la gare, les tours du quartier Nord abritent les administrations fédérales, régionales et flamandes et de grandes entreprises : environ 1,2 million de m² de bureaux et quelque 40 000 travailleurs, dont la plupart passent chaque jour par la gare du Nord.","side_odd":"Côté impair","side_even":"Côté pair","you":"Vous","show_map":"Voir sur la carte","walk_hint":"← Gare du Nord · Place Liedts →","map_err":"La carte ne se charge pas sur cet appareil. Ouvrez-la dans Google Maps avec le bouton ci-dessous.","hours_known":"horaires connus pour {n} commerces : les autres apparaîtront dès qu'ils auront complété leur fiche","update_title":"Vous tenez ce commerce ?","update_text":"Fiche déjà complétée par le commerçant. Pour modifier horaires, photos ou coordonnées, renvoyez le formulaire : la dernière version remplace la précédente.","update_btn":"Mettre à jour ma fiche","verified_field":"Vérifié sur place le","p2l":"Tarifs et disponibilités sur interparking.be →","p5t":"Place Liedts : trams et bus","p5":"La place Liedts, à l'autre bout de la rue, est desservie par les trams 25, 55, 62 et 93 et par plusieurs lignes de bus : un accès direct depuis Rogier, Schaerbeek, Laeken et le sud de Bruxelles.","p_src":"Sources : SNCB, comptages 2025 ; Interparking, fiche du parking Brabant – Gare du Nord ; STIB ; hub.brussels et ULB-IGEAT, Le commerce bruxellois en chiffres (données 2017).","a_more":"Découvrir l'association et son plan 2026-2030 →","nl_t":"Recevoir les nouvelles du quartier","nl_ph":"Votre adresse e-mail","nl_btn":"S'abonner","nl_ok":"Merci, vous êtes inscrit.","nl_err":"Adresse déjà inscrite ou invalide.","search_btn":"Rechercher","more":"Afficher plus de commerces ({n} restants)","vitrine":"Nouveautés en vitrine","vitrine_sub":"Les derniers articles photographiés par les commerçants du quartier.","gallery":"Articles en boutique","gallery_sub":"Photos publiées par le commerçant","nav_guide":"Guide du quartier","g_t":"Guide du quartier Nord","g_p":"Urgences, hôpitaux, police, communes, gare du Nord, transports, parking : les adresses utiles, vérifiées.","g_btn":"Ouvrir le guide","park_t":"Une heure de parking offerte","park_p":"Dès {min} € d'achat chez un commerçant participant : ticket de {h} h de parking gratuit au {parking}. À demander en caisse.","foot_qn":"Quartier Nord, le site du quartier","walk_auto":"Promenade","walk_full":"Plein écran","walk_from":"Gare du Nord","walk_to":"Place Liedts","walk_drag":"Glissez pour avancer · cliquez une façade pour ouvrir la fiche","walk_here":"Vous ête , duizend etalages","q_lead":"Op vijf minuten stappen van het station Brussel-Noord vormen de Brabantstraat en de omliggende straten een van de grootste winkelbuurten van Brussel, bekend tot ver over de grenzen.","q1t":"Bereikbaarheid","q1":"Noordstation (treinen, metro Rogier vlakbij), trams en bussen aan het Liedtsplein en het Noordstation. Parkings in de buurt.","q2t":"7 dagen op 7 open","q2":"De meeste winkels openen van maandag tot zaterdag rond 10 u en vele ook op zondag: zon- en feestdagen zijn feestdagen in de wijk.","q3t":"Prijs en originaliteit","q3":"Meer dan driehonderd winkels van 30 tot 700 m², tot tweeduizend artikelen elk. Een reputatie die al meer dan twintig jaar steunt op unieke producten en zeer scherpe prijzen.","q4t":"Talen","q4":"Frans, Nederlands, Engels, Arabisch, Turks, Urdu: elke fiche vermeldt de talen die in de winkel gesproken worden.","a_title":"De vereniging","a1":"ACRB, de Vereniging van Handelaars van de Brabantstraat (vzw opgericht in 1999, ondernemingsnummer 0468.701.030), verenigt de handelaars, ambachtslui en zelfstandigen van de Brabantstraat, het Liedtsplein, de Gallait-, Paleizen-, Rogier- en Quatrechtstraat en de Koninginnelaan, in Schaarbeek en Sint-Joost-ten-Node.","a2":"Ze brengt leven in de buurt (handelaarsdagen, Sinterklaas, eindejaarsfeesten, Ramadanmaaltijd, Smakenfestival), verdedigt de belangen van haar leden bij de gemeenten, het Gewest en de federale overheid, en werkt aan een properdere, veiligere en gastvrijere buurt.","a_contact":"Contact","a_addr":"Adres","a_member":"Bent u handelaar in de wijk?","a_member_text":"Werk uw fiche in vijf minuten bij, in het Frans, Nederlands, Engels, Turks, Arabisch of Urdu: ze verschijnt hier met uw uren, talen en foto's.","foot1":"Fiches opgesteld op basis van het openbaar ondernemingsregister (FOD Economie, Kruispuntbank van Ondernemingen, actieve vestigingseenheden opgevraagd op 28/11/2026) en aangevuld door de handelaars. De namen van de verantwoordelijken zijn die gepublic  Rue de Brabant Traders' Association (non-profit founded in 1999, company no. 0468.701.030), brings together the traders, craftspeople and self-employed of rue de Brabant, place Liedts, rue Gallait, rue des Palais, rue Rogier, rue de Quatrecht and avenue de la Reine, in Schaerbeek and Saint-Josse-ten-Noode.","a2":"It brings the district to life (shopping days, Saint Nicholas, year-end festivities, Ramadan dinner, Flavours Festival), defends its members' interests with the municipalities, the Region and the federal government, and works for a cleaner, safer and more welcoming district.","a_contact":"Contact","a_addr":"Address","a_member":"Are you a merchant in the district?","a_member_text":"Update your listing in five minutes, in French, Dutch, English, Turkish, Arabic or Urdu: it appears here with your hours, languages and photos.","foot1":"Listings built from the public business register (FPS Economy, Crossroads Bank for Enterprises, active establishment units retrieved on 28/11/2026) and completed by merchants. Names of people in charge are those published by the CBE.","foot2":"An error, a closed or relocated shop? Every listing has a \"Report\" button.","cats":{"mode":"Clothing and dresses","chaussures":"Shoes and bags","bijoux":"Jewellery, gold and watches","tissus":"Fabrics and haberdashery","beaute":"Hair and beauty","parfum":"Perfumery and cosmetics","alim":"Food","epicerie":"Grocery and supermarket","resto":"Restaurants and snacks","cafe":"Cafés and tea rooms","maison":"Home and decoration","electro":"Electronics and telecom","pharma":"Pharmacy and optician","culture":"Culture, toys and gifts","services":"Services and agencies","gros":"Wholesale","batiment":"Construction","transport":"Transport","sante":"Health","info":"IT","immo":"Real estate","asso":"Association","ens":"Education","b2b":"Business services","auto":"Car and car wash","hotel":"Accommodation","autre":"Other activities","autres_com":"Other shops","bazar":"Bazaar and discount","tabac":"Tobacco
