me noyau commercial de la Région bruxelloise, à cinq minutes à pied de la première gare du pays. Mode, caftans, tissus, bijoux, saveurs du Maghreb et d'Orient : des centaines de vitrines, numéro par numéro, avec leurs horaires et leurs responsables.","search_ph":"Une enseigne, un numéro, un article…","all_streets":"Toutes les rues","kpi1":"commerces avec vitrine","kpi2":"rues et places","kpi3":"fiches complétées par les commerçants","univers":"Explorer par univers","univers_sub":"Touchez un univers pour filtrer la liste.","all":"Tout","show_all":"Afficher aussi les entreprises sans vitrine (grossistes, bureaux, indépendants domiciliés)","found":"commerces","found1":"commerce","empty":"Aucun commerce ne correspond. Essayez un autre mot ou cochez « Afficher aussi les entreprises sans vitrine ».","verified":"Fiche à jour","open_now":"Ouvert","closed_now":"Fermé","until":"jusqu'à","opens":"ouvre à","resp":"Responsable","resps":"Responsables","back":"Tous les commerces","since":"Depuis","no_vitrine":"Sans vitrine","hours":"Horaires","today":"aujourd'hui","closed":"fermé","friday":"Vendredi : fermé pendant la prière","friday_open":"Vendredi : ouvert en continu","friday_var":"Vendredi : horaire variable à l'heure de la prière","summer":"heure d'été : une heure plus tard","eid":"Fermé les jours de l'Aïd al-Fitr et de l'Aïd al-Adha","eid_fitr":"Fermé le jour de l'Aïd al-Fitr","eid_adha":"Fermé le jour de l'Aïd al-Adha","other_closures":"Autres fermetures","languages":"Langues parlées","articles":"Articles","about_shop":"Présentation","contact":"Contact","phone":"Téléphone","website":"Site web","activities":"Activités déclarées","people":"Responsables","people_note":"Fonctions publiées au registre des entreprises.","company":"Société","name":"Dénomination","form":"Forme","created":"Créée en","complete_title":"Horaires, langues, photos","complete_text":"Pas encore renseignés. Vous tenez ce commerce ? Complétez votre fiche en cinq minutes : horaires, fermetures, langues parlées, logo et photo apparaîtront ici.","complete_btn":"Compléter ma fiche","route":"Itinéraire","bce":"Fiche BCE","report":"Signaler une erreur","report_what":"Que signalez-vous ?","r1":"Ce commerce est fermé","r2":"Ce commerce a déménagé","r3":"Le nom de l'enseigne est incorrect","r4":"L'activité est incorrecte","r5":"Autre erreur","r_comment":"Précisions (facultatif)","r_contact":"Votre e-mail ou téléphone (facultatif)","send":"Envoyer","r_ok":"Merci, votre signalement est transmis à l'ACRB.","r_ko":"Envoi impossible pour l'instant.","r_choose":"Choisissez un motif.","q_title":"Un quartier, mille vitrines","q_lead":"À cinq minutes à pied de la gare de Bruxelles-Nord, la rue de Brabant et les rues voisines forment l'un des plus grands quartiers commerçants de Bruxelles, connu bien au-delà des frontières.","q1t":"Accès","q1":"Gare du Nord (trains, métro Rogier à proximité), trams et bus à la place Liedts et à la gare du Nord. Parkings aux alentours.","q2t":"Ouvert 7 jours sur 7","q2":"La plupart des commerces ouvrent du lundi au samedi vers 10 h et beaucoup le dimanche : les dimanches et jours fériés sont jours de fête dans le quartier.","q3t":"Prix et originalité","q3":"Plus de trois cents magasins, de 30 à 700 m², jusqu'à deux mille articles chacun. Une réputation bâtie depuis plus de vingt ans sur des produits introuvables ailleurs et des prix très compétitifs.","q4t":"Langues","q4":"Français, néerlandais, anglais, arabe, turc, ourdou : chaque fiche indique les langues parlées en magasin.","a_title":"L'association","a1":"L'ACRB, Association des Commerçants de la Rue de Brabant (asbl créée en 1999, n° d'entreprise 0468.701.030), réunit les commerçants, artisans et indépendants de la rue de Brabant, de la place Liedts, des rues Gallait, des Palais, Rogier, de Quatrecht et de l'avenue de la Reine, sur les communes de Schaerbeek et de Saint-Josse-ten-Noode.","a2":"Elle anime le quartier (braderies, Saint-Nicolas, fêtes de fin d'année, repas du Ramadan, Festival des Saveurs), défend les intérêts de ses membres auprès des communes, de la Région et de l'État fédéral, et travaille à un quartier plus propre, plus sûr et plus accueillant.","a_contact":"Contact","a_addr":"Adresse","a_member":"Vous êtes commerçant dans le quartier ?","a_member_text":"Mettez votre fiche à jour en cinq minutes, en français, néerlandais, anglais, turc, arabe ou ourdou : elle apparaît ici avec vos horaires, vos langues et vos photos.","foot1":"Fiches établies à partir du registre public des entreprises (SPF Économie, Banque-Carrefour des Entreprises, unités d'établissement actives relevées le 08/11/2026) et complétées par les commerçants. Les noms des responsables sont ceux publiés par la BCE.","foot2":"Une erreur, un commerce fermé ou déménagé ? Chaque fiche a un bouton « Signaler ».","cats":{"mode":"Vêtements et robes","chaussures":"Chaussures et sacs","bijoux":"Bijoux, or et montres","tissus":"Tissus et mercerie","beaute":"Coiffure et beauté","parfum":"Parfumerie et cosmétiques","alim":"Alimentation","epicerie":"Épicerie et supermarché","resto":"Restaurants et snacks","cafe":"Cafés et salons de thé","maison":"Maison et décoration","electro":"Électronique et télécom","pharma":"Pharmacie et optique","culture":"Culture, jouets et cadeaux","services":"Services et agences","gros":"Commerce de gros","batiment":"Bâtiment","transport":"Transport","sante":"Santé","info":"Informatique","immo":"Immobilier","asso":"Association","ens":"Enseignement","b2b":"Services aux entreprises","auto":"Auto et car-wash","hotel":"Hébergement","autre":"Autres activités","autres_com":"Autres commerces","bazar":"Bazar et discount","tabac":"Tabac et presse"},"roles":{"gerant":"Gérant·e","admin":"Administrateur·rice","admindel":"Administrateur délégué","indep":"Indépendant·e","rep":"Représentant permanent","assoc":"Associé·e","pres":"Président·e","autre":"Responsable"},"days":["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],"communes":{"1030":"Schaerbeek","1210":"Saint-Josse-ten-Noode","1000":"Bruxelles"},"open_now_f":"Ouvert maintenant","near":"Près de moi","near_err":"Position indisponible","map":"La carte","map_sub":"Chaque numéro à sa place. Touchez un point pour ouvrir la fiche.","walk":"La balade","walk_sub":"La rue de Brabant comme si vous la remontiez : côté impair en haut, côté pair en bas. Faites défiler.","featured":"À la une","featured_sub":"Les commerces qui ont complété leur fiche : horaires, langues, photos.","m":"m","dist":"à","list_title":"Tous les commerces","nav_map":"Carte","nav_walk":"Balade","practical":"Infos pratiques","p1t":"Venir en train : la première gare du pays","p1":"Bruxelles-Nord est la gare la plus fréquentée de Belgique : 61 362 voyageurs par jour de semaine (SNCB, 2025). La rue de Brabant commence à 5 minutes à pied de la sortie rue d'Aerschot. Trains IC et S, bus De Lijn et STIB, métro Rogier à 10 minutes.","p2t":"Se garer : Interparking Brabant – Gare du Nord","p2":"Rue de Quatrecht 38, au cœur du quartier : 158 places dont 5 PMR, ouvert 24 h/24, 6 bornes de recharge électrique, hauteur 2 m. D'autres parkings publics autour de la gare du Nord et de la place Rogier.","p3t":"Quand venir","p3":"Du lundi au samedi dès 10 h ; beaucoup de commerces ouvrent aussi le dimanche. Le vendredi, certains ferment pendant la prière (vers 13 h). Les fêtes de fin d'année et les braderies de printemps sont les grands rendez-vous.","p4t":"Le quartier Nord, à deux pas","p4":"Derrière la gare, les tours du quartier Nord abritent les administrations fédérales, régionales et flamandes et de grandes entreprises : environ 1,2 million de m² de bureaux et quelque 40 000 travailleurs, dont la plupart passent chaque jour par la gare du Nord.","side_odd":"Côté impair","side_even":"Côté pair","you":"Vous","show_map":"Voir sur la carte","walk_hint":"← Place Liedts · Gare du Nord →","map_err":"La carte ne se charge pas sur cet appareil. Ouvrez-la dans Google Maps avec le bouton ci-dessous.","hours_known":"horaires connus pour  Schaarbeek & Sint-Joost, Brussel","h1a":"Shoppen","h1b":"in de Brabantstraat","lead":"Zesde handelskern van het Brussels Gewest, op vijf minuten stappen van het drukste station van het land. Mode, kaftans, stoffen, juwelen, smaken uit de Maghreb en het Oosten: honderden etalages, nummer per nummer, met openingsuren en verantwoordelijken.","search_ph":"Een winkel, een huisnummer, een artikel…","all_streets":"Alle straten","kpi1":"winkels met etalage","kpi2":"straten en pleinen","kpi3":"fiches aangevuld door de handelaars","univers":"Ontdek per wereld","univers_sub":"Tik op een wereld om de lijst te filteren.","all":"Alles","show_all":"Toon ook bedrijven zonder etalage (groothandel, kantoren, gedomicilieerde zelfstandigen)","found":"winkels","found1":"winkel","empty":"Geen winkel gevonden. Probeer een ander woord of vink « Toon ook bedrijven zonder etalage » aan.","verified":"Bijgewerkte fiche","open_now":"Open","closed_now":"Gesloten","until":"tot","opens":"opent om","resp":"Verantwoordelijke","resps":"Verantwoordelijken","back":"Alle winkels","since":"Sinds","no_vitrine":"Zonder etalage","hours":"Openingsuren","today":"vandaag","closed":"gesloten","friday":"Vrijdag: gesloten tijdens het gebed","friday_open":"Vrijdag: doorlopend open","friday_var":"Vrijdag: wisselende uren rond het gebed","summer":"zomertijd: een uur later","eid":"Gesloten op Eid al-Fitr en Eid al-Adha","eid_fitr":"Gesloten op Eid al-Fitr","eid_adha":"Gesloten op Eid al-Adha","other_closures":"Andere sluitingen","languages":"Gesproken talen","articles":"Artikelen","about_shop":"Voorstelling","contact":"Contact","phone":"Telefoon","website":"Website","activities":"Aangegeven activiteiten","people":"Verantwoordelijken","people_note":"Functies gepubliceerd in het ondernemingsregister.","company":"Vennootschap","name":"Naam","form":"Rechtsvorm","created":"Opgericht in","complete_title":"Uren, talen, foto's","complete_text":"Nog niet ingevuld. Baat u deze winkel uit? Vul uw fiche in vijf minuten aan: uren, sluitingen, talen, logo en foto verschijnen hier.","complete_btn":"Mijn fiche aanvullen","route":"Route","bce":"KBO-fiche","report":"Fout melden","report_what":"Wat meldt u?","r1":"Deze winkel is gesloten","r2":"Deze winkel is verhuisd","r3":"De naam is onjuist","r4":"De activiteit is onjuist","r5":"Andere fout","r_comment":"Toelichting (optioneel)","r_contact":"Uw e-mail of telefoon (optioneel)","send":"Verzenden","r_ok":"Bedankt, uw melding is doorgegeven aan de ACRB.","r_ko":"Verzenden momenteel niet mogelijk.","r_choose":"Kies een reden.","q_title":"Eén wijk, duizend etalages","q_lead":"Op vijf minuten stappen van het station Brussel-Noord vormen de Brabantstraat en de omliggende straten een van de grootste winkelbuurten van Brussel, bekend tot ver over de grenzen.","q1t":"Bereikbaarheid","q1":"Noordstation (treinen, metro Rogier vlakbij), trams en bussen aan het Liedtsplein en het Noordstation. Parkings in de buurt.","q2t":"7 dagen op 7 open","q2":"De meeste winkels openen van maandag tot zaterdag rond 10 u en vele ook op zondag: zon- en feestdagen zijn feestdagen in de wijk.","q3t":"Prijs en originaliteit","q3":"Meer dan driehonderd winkels van 30 tot 700 m², tot tweeduizend artikelen elk. Een reputatie die al meer dan twintig jaar steunt op unieke producten en zeer scherpe prijzen.","q4t":"Talen","q4":"Frans, Nederlands, Engels, Arabisch, Turks, Urdu: elke fiche vermeldt de talen die in de winkel gesproken worden.","a_title":"De vereniging","a1":"ACRB, de Vereniging van Handelaars van de Brabantstraat (vzw opgericht in 1999, ondernemingsnummer 0468.701.030), verenigt de handelaars, ambachtslui en zelfstandigen van de Brabantstraat, het Liedtsplein, de Gallait-, Paleizen-, Rogier- en Quatrechtstraat en de Koninginnelaan, in Schaarbeek en Sint-Joost-ten-Node.","a2":"Ze brengt leven in de buurt (braderieën, Sinterklaas, eindejaarsfeesten, Ramadanmaaltijd, Smakenfestival), verdedigt de belangen van haar leden bij de gemeenten, het Gewest en de federale overheid, en werkt aan een properdere, veiligere en gastvrijere buurt.","a_contact":"Contact","a_addr":"Adres","a_member":"Bent u handelaar in de wijk?","a_member_text":"Werk uw fiche in vijf minuten bij, in het Frans, Nederlands, Engels, Turks, Arabisch of Urdu: ze verschijnt hier met uw uren, talen en foto's.","foot1":"Fiches opgesteld op basis van het openbaar ondernemingsregister (FOD Economie, Kruispuntbank van Ondernemingen, actieve vestigingseenheden opgevraagd op 08/11/2026) en aangevuld door de handelaars. De namen van de verantwoordelijken zijn die gepubliceerd door de KBO.","foot2":"Een fout, een gesloten of verhuisde winkel? Elke fiche heeft een knop « Melden ».","cats":{"mode":"Kleding en jurken","chaussures":"Schoenen en tassen","bijoux":"Juwelen, goud en uurwerken","tissus":"Stoffen en fournituren","beaute":"Kapper en schoonheid","parfum":"Parfumerie en cosmetica","alim":"Voeding","epicerie":"Kruidenier en supermarkt","resto":"Restaurants en snacks","cafe":"Cafés en theesalons","maison":"Huis en decoratie","electro":"Elektronica en telecom","pharma":"Apotheek en optiek","culture":"Cultuur, speelgoed en geschenken","services":"Diensten en agentschappen","gros":"Groothandel","batiment":"Bouw","transport":"Transport","sante":"Gezondheid","info":"Informatica","immo":"Vastgoed","asso":"Vereniging","ens":"Onderwijs","b2b":"Zakelijke diensten","auto":"Auto en carwash","hotel":"Logies","autre":"Andere activiteiten","autres_com":"Andere winkels","bazar":"Bazaar en discount","tabac":"Tabak en pers"},"roles":{"gerant":"Zaakvoerder","admin":"Bestuurder","admindel":"Gedelegeerd bestuurder","indep":"Zelfstandige","rep":"Vaste vertegenwoordiger","assoc":"Vennoot","pres":"Voorzitter","autre":"Verantwoordelijke"},"days":["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"],"communes":{"1030":"Schaarbeek","1210":"Sint-Joost-ten-Node","1000":"Brussel"},"open_now_f":"Nu open","near":"In mijn buurt","near_err":"Locatie niet beschikbaar","map":"De kaart","map_sub":"Elk huisnummer op zijn plaats. Tik op een punt om de fiche te openen.","walk":"De wandeling","walk_sub":"De Brabantstraat alsof u ze afloopt: oneven kant boven, even kant onder. Scrol.","featured":"In de kijker","featured_sub":"Winkels die hun fiche hebben aangevuld: uren, talen, foto's.","m":"m","dist":"op","list_title":"Alle winkels","nav_map":"Kaart","nav_walk":"Wandeling","practical":"Praktisch","p1t":"Met de trein: het drukste station van het land","p1":"Brussel-Noord is het drukste station van België: 61 362 reizigers per weekdag (NMBS, 2025). De Brabantstraat begint op 5 minuten stappen van de uitgang Aarschotstraat. IC- en S-treinen, bussen van De Lijn en MIVB, metro Rogier op 10 minuten.","p2t":"Parkeren: Interparking Brabant – Noordstation","p2":"Quatrechtstraat 38, midden in de buurt: 158 plaatsen waarvan 5 voor personen met een beperking, 24 u/24 open, 6 laadpalen, hoogte 2 m. Andere openbare parkings rond het Noordstation en het Rogierplein.","p3t":"Wanneer komen","p3":"Van maandag tot zaterdag vanaf 10 u; veel winkels zijn ook op zondag open. Op vrijdag sluiten sommige tijdens het gebed (rond 13 u). De eindejaarsfeesten en de lentebraderieën zijn de grote afspraken.","p4t":"De Noordwijk, om de hoek","p4":"Achter het station huisvesten de torens van de Noordwijk federale, gewestelijke en Vlaamse administraties en grote bedrijven: ongeveer 1,2 miljoen m² kantoren en zo'n 40 000 werknemers, van wie de meesten dagelijks via het Noordstation passeren.","side_odd":"Oneven kant","side_even":"Even kant","you":"U","show_map":"Toon op kaart","walk_hint":"← Liedtsplein · Noordstation →","map_err":"De kaart laadt niet op dit toestel. Open ze in Google Maps met de knop hieronder.","hours_known":"uren gekend voor {n} winkels: de andere verschijnen zodra ze hun fiche aanvullen","update_title":"Baat u deze winkel uit?","update_text":"Fiche al ingevuld door de handelaar. Om uren, foto's of gegevens te wijzigen, stuurt u het formulier opnieuw: de laatste versie vervangt de vorige.","update_btn":"Mijn fiche bijwerken","verified_field":"Ter plaatse gecontroleerd op","p2l":"Tarieven en beschikbaarheid op interparking.be →","p5t":"Liedtsplein: trams en bussen","p5":"Het Liedtsplein, aan het andere uiteinde van de straat, wordt bediend door de trams 25, 55, 62 en 93 en door verschillende buslijnen: rechtstreeks vanuit Rogier, Schaarbeek, Laken en het zuiden van Brussel.","p_src":"Bronnen: NMBS, tellingen 2025; Interparking, fiche parking Brabant – Noordstation; MIVB; hub.brussels en ULB-IGEAT, De Brusselse handel in cijfers (gegevens 2017).","a_more":"De vereniging en haar plan 2026-2030 ontdekken →","nl_t":"Het nieuws van de buurt ontvangen","nl_ph":"Uw e-mailadres","nl_btn":"Inschrijven","nl_ok":"Bedankt, u bent ingeschreven.","nl_err":"Adres al ingeschreven of ongeldig.","search_btn":"Zoeken","more":"Meer zaken tonen ({n} resterend)","vitrine":"Nieuw in de etalage","vitrine_sub":"De laatste artikelen gefotografeerd door de handelaars van de wijk.","gallery":"Artikelen in de winkel","gallery_sub":"Foto's gepubliceerd door de handelaar","nav_guide":"Buurtgids","g_t":"Gids van de Noordwijk","g_p":"Noodnummers, ziekenhuizen, politie, gemeenten, Noordstation, vervoer, parking: de nuttige adressen, gecontroleerd.","g_btn":"Gids openen","park_t":"Een uur gratis parkeren","park_p":"Vanaf {min} € aankoop bij een deelnemende handelaar: ticket voor {h} u gratis parkeren in {parking}. Vraag ernaar aan de kassa.","foot_qn":"Noordwijk, de site van de wijk"},"en":{"title":"Shopping Brabant — The shops of rue de Brabant, Brussels","nav_shops":"Shops","nav_quartier":"The district","nav_asso":"The association","nav_fiche":"Merchant area","eyebrow":"Shopping Brabant · Schaerbeek & Saint-Josse, Brussels","h1a":"Shopping","h1b":"on rue de Brabant","lead":"The Brussels Region's sixth-largest retail cluster, five minutes' walk from the busiest station in the country. Fashion, caftans, fabrics, jewellery, flavours of the Maghreb and the East: hundreds of shopfronts, number by number, with opening hours and managers.","search_ph":"A shop, a number, an item…","all_streets":"All streets","kpi1":"shops with a storefront","kpi2":"streets and squares","kpi3":"listings completed by merchants","univers":"Browse by world","univers_sub":"Tap a world to filter the list.","all":"All","show_all":"Also show businesses without a storefront (wholesalers, offices, registered self-employed)","found":"shops","found1":"shop","empty":"No shop matches. Try another word or tick \"Also show businesses without a storefront\".","verified":"Up-to-date listing","open_now":"Open","closed_now":"Closed","until":"until","opens":"opens at","resp":"In charge","resps":"In charge","back":"All shops","since":"Since","no_vitrine":"No storefront","hours":"Opening hours","today":"today","closed":"closed","friday":"Friday: closed during prayer","friday_open":"Friday: open all day","friday_var":"Friday: hours vary around prayer time","summer":"summer time: one hour later","eid":"Closed on Eid al-Fitr and Eid al-Adha","eid_fitr":"Closed on Eid al-Fitr","eid_adha":"Closed on Eid al-Adha","other_closures":"Other closures","languages":"Languages spoken","articles":"Items","about_shop":"About","contact":"Contact","phone":"Phone","website":"Website","activities":"Declared activities","people":"People in charge","people_note":"Roles published in the business register.","company":"Company","name":"Name","form":"Legal form","created":"Founded in","complete_title":"Hours, languages, photos","complete_text":"Not provided yet. Do you run this shop? Complete your listing in five minutes: hours, closures, languages, logo and photo will appear here.","complete_btn":"Complete my listing","route":"Directions","bce":"CBE record","report":"Report an error","report_what":"What are you reporting?","r1":"This shop is closed","r2":"This shop has moved","r3":"The name is wrong","r4":"The activity is wrong","r5":"Other error","r_comment":"Details (optional)","r_contact":"Your e-mail or phone (optional)","send":"Send","r_ok":"Thank you, your report has been sent to the ACRB.","r_ko":"Cannot send right now.","r_choose":"Choose a reason.","q_title":"One district, a thousand shopfronts","q_lead":"Five minutes' walk from Brussels-North station, rue de Brabant and the neighbouring streets form one of the largest shopping districts in Brussels, known far beyond the borders.","q1t":"Getting here","q1":"Brussels-North station (trains, Rogier metro nearby), trams and buses at place Liedts and the North station. Car parks nearby.","q2t":"Open 7 days a week","q2":"Most shops open Monday to Saturday around 10 am and many on Sunday: Sundays and public holidays are festive days in the district.","q3t":"Prices and originality","q3":"More than three hundred shops, from 30 to 700 m², up to two thousand items each. A reputation built over twenty years on products found nowhere else and very competitive prices.","q4t":"Languages","q4":"French, Dutch, English, Arabic, Turkish, Urdu: each listing shows the languages spoken in the shop.","a_title":"The association","a1":"ACRB, the Rue de Brabant Traders' Association (non-profit founded in 1999, company no. 0468.701.030), brings together the traders, craftspeople and self-employed of rue de Brabant, place Liedts, rue Gallait, rue des Palais, rue Rogier, rue de Quatrecht and avenue de la Reine, in Schaerbeek and Saint-Josse-ten-Noode.","a2":"It brings the district to life (street sales, Saint Nicholas, year-end festivities, Ramadan dinner, Flavours Festival), defends its members' interests with the municipalities, the Region and the federal government, and works for a cleaner, safer and more welcoming district.","a_contact":"Contact","a_addr":"Address","a_member":"Are you a merchant in the district?","a_member_text":"Update your listing in five minutes, in French, Dutch, English, Turkish, Arabic or Urdu: it appears here with your hours, languages and photos.","foot1":"Listings built from the public business register (FPS Economy, Crossroads Bank for Enterprises, active establishment units retrieved on 08/11/2026) and completed by merchants. Names of people in charge are those published by the CBE.","foot2":"An error, a closed or relocated shop? Every listing has a \"Report\" button.","cats":{"mode":"Clothing and dresses","chaussures":"Shoes and bags","bijoux":"Jewellery, gold and watches","tissus":"Fabrics and haberdashery","beaute":"Hair and beauty","parfum":"Perfumery and cosmetics","alim":"Food","epicerie":"Grocery and supermarket","resto":"Restaurants and snacks","cafe":"Cafés and tea rooms","maison":"Home and decoration","electro":"Electronics and telecom","pharma":"Pharmacy and optician","culture":"Culture, toys and gifts","services":"Services and agencies","gros":"Wholesale","batiment":"Construction","transport":"Transport","sante":"Health","info":"IT","immo":"Real estate","asso":"Association","ens":"Education","b2b":"Business services","auto":"Car and car wash","hotel":"Accommodation","autre":"Other activities","autres_com":"Other shops","bazar":"Bazaar and discount","tabac":"Tobacco and press"},"roles":{"gerant":"Manager","admin":"Director","admindel":"Managing director","indep":"Self-employed","rep":"Permanent representative","assoc":"Partner","pres":"Chair","autre":"In charge"},"days":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],"communes":{"1030":"Schaerbeek","1210":"Saint-Josse-ten-Noode","1000":"Brussels"},"open_now_f":"Open now","near":"Near me","near_err":"Location unavailable","map":"The map","map_sub":"Every number in its place. Tap a dot to open the listing.","walk":"The walk","walk_sub":"Rue de Brabant as if you were walking it: odd side on top, even side below. Scroll along.","featured":"Featured","featured_sub":"Shops that completed their listing: hours, languages, photos.","m":"m","dist":"at","list_title":"All shops","nav_map":"Map","nav_walk":"Walk","practical":"Practical info","p1t":"By train: the busiest station in Belgium","p1":"Brussels-North is the busiest station in the country: 61,362 passengers per weekday (SNCB, 2025). Rue de Brabant starts 5 minutes' walk from the rue d'Aerschot exit. IC and S trains, De Lijn and STIB buses, Rogier metro 10 minutes away.","p2t":"Parking: Interparking Brabant – Gare du Nord","p2":"Rue de Quatrecht 38, in the heart of the district: 158 spaces including 5 accessible, open 24/7, 6 EV charging points, 2 m clearance. Other public car parks around Brussels-North and place Rogier.","p3t":"When to come","p3":"Monday to Saturday from 10 am; many shops also open on Sunday. On Fridays some close during prayer (around 1 pm). The year-end holidays and the spring street sales are the big dates.","p4t":"The Northern Quarter, next door","p4":"Behind the station, the towers of the Northern Quarter house federal, regional and Flemish administrations and major companies: about 1.2 million m² of offices and some 40,000 workers, most of whom pass through Brussels-North every day.","side_odd":"Odd side","side_even":"Even side","you":"You","show_map":"Show on map","walk_hint":"← Place Liedts · North station →","map_err":"The map does not load on this device. Open it in Google Maps with the button below.","hours_known":"hours known for {n} shops: the others will appear once they complete their listing","update_title":"Do you run this shop?","update_text":"Listing already completed by the merchant. To change hours, photos or contact details, resend the form: the latest version replaces the previous one.","update_btn":"Update my listing","verified_field":"Checked on site on","p2l":"Rates and availability on interparking.be →","p5t":"Place Liedts: trams and buses","p5":"Place Liedts, at the other end of the street, is served by trams 25, 55, 62 and 93 and several bus lines: direct access from Rogier, Schaerbeek, Laeken and the south of Brussels.","p_src":"Sources: SNCB, 2025 counts; Interparking, Brabant – Gare du Nord car park page; STIB; hub.brussels and ULB-IGEAT   right.push('<div class="box"><h5>'+(f?T.update_title:T.complete_title)+'</h5><div class="note">'+(f?T.update_text:T.complete_text)+'</div><div class="actions"><a class="btn p" href="fiche.html?ue='+s.id+'">'+(f?T.update_btn:T.complete_btn)+'</a></div></div>');
  right.push('<div class="box"><div class="actions"><a class="btn" href="'+esc(s.lien)+'" target="_blank" rel="noopener">'+T.bce+'</a><button type="button" class="btn" id="repbtn">'+T.report+'</button></div>'+
    '<form class="rep" id="rep"><select id="motif"><option value="">'+T.report_what+'</option><option>'+T.r1+'</option><option>'+T.r2+'</option><option>'+T.r3+'</option><option>'+T.r4+'</option><option>'+T.r5+'</option></select><textarea id="comm" placeholder="'+esc(T.r_comment)+'"></textarea><input type="text" id="contact" placeholder="'+esc(T.r_contact)+'"><div class="actions"><button type="submit" class="btn p">'+T.send+'</button></div><div id="repmsg" class="note"></div></form></div>');
  v.innerHTML='<div class="fiche"><a class="back" href="#">← '+T.back+'</a>'+
   '<div class="fhero" style="--c:'+c+'">'+(f&&f.photo_url?'<img class="ph" src="'+esc(f.photo_url)+'" alt="">':'<div class="pat"></div>')+'<div class="in"><div class="logo">'+avatar(s)+'</div><div><div class="addr">'+esc(s.rue)+' '+s.num+' · '+esc(s.cp)+' '+esc(commune)+'</div><h1>'+esc(s.n)+'</h1>'+
   '<div class="badges"><span class="badge" style="background:'+c+'">'+esc(T.cats[s.cat])+'</span>'+((f&&f.debut_activite)||s.y?'<span class="badge">'+T.since+' '+esc((f&&f.debut_activite)||s.y)+'</span>':'')+(f?'<span class="badge g">✓ '+T.verified+'</span>':'')+(s.vl?'<span class="badge g">✓ '+T.verified_field+' '+s.vl.split("-").reverse().join("/")+'</span>':'')+(stt?'<span class="badge o">'+esc(stt.txt)+'</span>':'')+(s.v?'':'<span class="badge">'+T.no_vitrine+'</span>')+'</div></div></div></div>'+
   '<div class="cols"><div class="col">'+left.join("")+'</div><div class="col">'+right.join("")+'</div></div></div>';
  if(s.ll&&window.L){var fm=L.map("fmap",{scrollWheelZoom:false,dragging:false,zoomControl:false}).setView(s.ll,17);L.tileLayer(TILES[tileIdx],{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(fm);L.marker(s.ll,{icon:L.divIcon({className:"",html:'<div class="mk" style="background:'+c+';width:18px;height:18px"></div>',iconSize:[18,18]})}).addTo(fm);}
  Array.prototype.forEach.call(v.querySelectorAll(".gal button"),function(b){b.addEventListener("click",function(){var p=gal[+b.dataset.g];lightbox(PH_URL+p.chemin,(p.legende||"")+(p.prix!=null?" — "+(+p.prix).toFixed(2).replace(".",",")+" €":""));});});
  var rep=document.getElementById("rep");
  document.getElementById("repbtn").addEventListener("click",function(){rep.classList.toggle("open");});
  rep.addEventListener("submit",function(e){
    e.preventDefault();var m=document.getElementById("motif").value;var msg=document.getElementById("repmsg");
    if(!m){msg.textContent=T.r_choose;return;}
    fetch(SB+"/rest/v1/acrb_signalements",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({ue:s.id,bce:s.bce,enseigne:s.n,motif:m,commentaire:document.getElementById("comm").value||null,contact:document.getElementById("contact").value||null,user_agent:navigator.userAgent.slice(0,200)})})
    .then(function(r){msg.innerHTML=r.ok?'<span class="ok">'+T.r_ok+'</span>':T.r_ko;}).catch(function(){msg.textContent=T.r_ko;});
  });
  document.title=s.n+" · "+s.rue+" "+s.num+" · ACRB";
}
function route(){
  var h=location.hash||"";var isF=/^#c-\d+$/.test(h);
  document.getElementById("v-home").hidden=isF;document.getElementById("v-fiche").hidden=!isF;
  Array.prototype.forEach.call(document.querySelectorAll("#navlinks a[data-v]"),function(a){a.classList.toggle("on",!isF);});
  if(isF){fiche(h.slice(3));window.scrollTo(0,0);}else{document.title=T.title;if(map)setTimeout(function(){map.invalidateSize();},50);}
}
window.addEventListener("hashchange",route);
var l0="fr";try{l0=new URLSearchParams(location.search).get("lang")||localStorage.getItem("acrb_site_lang")||(navigator.language||"fr").slice(0,2);}catch(e){}
if(!I18N[l0])l0="fr";L_=l0;T=I18N[L_];applyLang();render();walk();initMap();route();loadForm();
</script>
