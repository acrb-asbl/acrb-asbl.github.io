<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Brabant — Fiche commerçant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1d1b17; --muted:#6a655c; --line:#dcd7cc;
  --accent:#9b3a2a; --accent-fg:#ffffff; --err:#b42318; --field:#fbfaf7; --soft:#f7ebe8;
  --display:"Libre Franklin","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);font-family:var(--body);padding:0 max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Source Sans 3",system-ui,sans-serif;font-size:17px}
html[dir=rtl] h1,html[dir=rtl] .card h2,html[dir=rtl] .done h2{font-family:"Noto Naskh Arabic",serif;font-weight:600}
/* arabe / ourdou : les champs se saisissent en caractères latins, de gauche à droite */
html[dir=rtl] input:not([type=checkbox]):not([type=radio]),html[dir=rtl] textarea,html[dir=rtl] select{direction:ltr;text-align:left;font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;unicode-bidi:plaintext}
html[dir=rtl] input::placeholder,html[dir=rtl] textarea::placeholder{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",sans-serif}
.latin{display:none;margin:-6px 0 14px;padding:10px 12px;background:var(--soft);border-left:4px solid var(--accent);font-size:15px}html[dir=rtl] .latin{display:block;border-left:0;border-right:4px solid var(--accent)}
.wrap{max-width:720px;margin:0 auto}
.langs{display:flex;flex-wrap:wrap;gap:6px;padding-top:16px}
.langs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
header{padding:24px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[dir=rtl] .eyebrow{letter-spacing:0}
h1{font:800 clamp(28px,5.5vw,38px)/1.12 var(--display);letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-top:18px}
.card h2{font:700 21px/1.2 var(--display);margin:0 0 4px}
.card .hint{color:var(--muted);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid .full{grid-column:1/-1}
@media(max-width:560px){.grid{grid-template-columns:1fr} }
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
label small{font-weight:400;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=time],select,textarea{
  width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--fg);font:inherit}
input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.req::after{content:" *";color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;cursor:pointer;background:var(--field);margin:0}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;font-size:14px}
.days span{font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:10px}
.consent input{margin-top:4px;accent-color:var(--accent);flex:none}
.consent label{font-weight:400;margin:0}
button{font:inherit;cursor:pointer}
.item{border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:14px;background:var(--field)}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.item .top h3{margin:0;font-size:16px}
.item .top .n{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:999px;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;margin-inline-end:8px}
.rm{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.adds{display:grid;gap:8px;margin-top:14px}
.add{width:100%;padding:12px;border:1px dashed var(--accent);border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
details .grid,details .days{margin-top:12px}
.sub{display:grid;gap:12px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.submit{width:100%;padding:14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:17px;margin-top:22px}
.submit[disabled]{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;display:none}
.msg.err{display:block;background:#fdeceb;color:var(--err)}
.done{text-align:center;padding:48px 24px}
.done h2{font:800 26px/1.15 var(--display);margin:0 0 10px}
.done p{color:var(--muted)}.done .ref{font-family:monospace;font-size:13px}
.hp{position:absolute!important;width:1px!important;min-width:0!important;height:1px!important;padding:0!important;border:0!important;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}.chk{display:flex;gap:8px;align-items:center;font-size:15px}.chk small{color:var(--muted)}
.lookup{display:flex;gap:8px;margin-top:10px}.lookup input{flex:1}.lookup button{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;white-space:nowrap}
.hits{display:grid;gap:6px;margin-top:10px}.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit}
.hit b{display:block;font-size:15px}.hit small{color:var(--muted)}.hit .pick{color:var(--accent);font-weight:600;white-space:nowrap}
.picked{display:grid;gap:6px;margin-top:10px}.picked div{padding:8px 12px;border-radius:8px;background:var(--soft);font-size:14px;display:flex;justify-content:space-between;gap:8px}.picked button{background:none;border:0;color:var(--err);font-weight:600}
.lkmsg{font-size:13px;color:var(--muted);margin-top:8px}
[hidden]{display:none!important}
/* WebKit (iPhone) : les champs heure et les listes imposaient leur largeur minimale aux grilles (14 px de débordement) */
.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid>*,.times>*,.days>*,.item,.card{min-width:0}.times{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.days{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr)}
input,select,textarea{max-width:100%}
/* ——— Fiche commerçant : étapes, brouillon, contrôles, mode « Ma fiche » (23/11) ——— */
.card{box-shadow:0 1px 2px rgba(29,27,23,.04),0 4px 14px rgba(29,27,23,.04);border-radius:14px}
.loginhint{margin:10px 0 0;font-size:15px}.loginhint a{color:var(--accent);font-weight:600}
.steps{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 8px;margin:0 -2px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps button{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;min-height:44px}
.steps button b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:999px;background:var(--line);color:var(--fg);font-size:12px}
.steps button[aria-current=step]{border-color:var(--accent);color:var(--accent)}.steps button[aria-current=step] b{background:var(--accent);color:var(--accent-fg)}
.steps button.ok b{background:#2e7d4f;color:#fff}
.bar{height:6px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.barl{font-size:12px;color:var(--muted);margin-top:4px}
.warn{margin:5px 0 0;font-size:13px;color:#8a5a00;background:#fff6e0;border-radius:6px;padding:5px 8px}
.need{outline:2px solid #e0a100!important;outline-offset:1px}
.draft{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:10px;background:#eef6f0;font-size:14px}
.draft button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
@media(max-width:700px){body.stk #btn,#mf_save{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:7;box-shadow:0 6px 20px rgba(155,58,42,.28)}}
/* Ma fiche */
body.mf-wait #f,body.mf-on #f,body.mf-on header>h1,body.mf-on header>p:not(.latin),body.mf-on #loginhint{display:none}
body.mf-on.mf-add #f{display:block}
.mfwait{display:none;margin-top:18px;color:var(--muted)}body.mf-wait .mfwait{display:block}
.mfhead{display:flex;gap:16px;align-items:center;margin-top:6px}
.mfhead .av{flex:none;width:72px;height:72px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font:800 30px var(--display);color:var(--accent);overflow:hidden;border:1px solid var(--line)}
.mfhead .av img{width:100%;height:100%;object-fit:cover}
.mfhead h1{margin:4px 0 4px;font-size:clamp(24px,5vw,32px);overflow-wrap:anywhere}
.mfban{margin:0;font-size:14px;color:var(--muted)}.mfban b{color:var(--fg)}
.mfacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn2{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:var(--fg);color:#fff;font-weight:600;text-decoration:none;font-size:15px;min-height:44px}
.btn2.off{background:var(--line);color:var(--muted);pointer-events:none}
.lnk{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;color:var(--fg);min-height:44px}
.lock{background:#faf9f6}.lock h2 .pad{font-size:17px}
.ro{background:#f1efe9!important;color:#4a463f!important;border-style:dashed!important;cursor:not-allowed}
.lock label .pad{font-weight:400;margin-inline-start:4px}
.ph{display:flex;gap:12px;align-items:center}.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none}
.ph input[type=file]{flex:1;min-width:0;width:100%;font-size:14px}
.ph .none{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);flex:none}
.ok-msg{display:block;background:#e9f6ee;color:#1f5f3a}
</style>
</head>
<body>
<div class="wrap">
<div class="langs" id="langs" role="group" aria-label="Langue / Taal / Language / Dil / اللغة / زبان">
  <button type="button" data-lang="fr">Français</button>
  <button type="button" data-lang="nl">Nederlands</button>
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="tr">Türkçe</button>
  <button type="button" data-lang="ar">العربية</button>
  <button type="button" data-lang="ur">اردو</button>
</div>
<header>
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1 data-i18n="h1"></h1>
  <p data-i18n="intro"></p>
  <p class="latin" data-i18n="latin_hint"></p>
  <p class="loginhint" id="loginhint" hidden><a href="../espace/commercant.html" data-t="login"></a></p>
</header>
<p class="mfwait" data-t="mf_wait"></p>
<div id="mf" hidden></div>

<form id="f" novalidate>
<input class="hp" type="text" name="website_url" id="website_url" tabindex="-1" autocomplete="off">
<nav class="steps" id="steps" aria-label="Étapes"><ol><li><button type="button" data-go="0"><b>1</b><span data-t="st1"></span></button></li><li><button type="button" data-go="1"><b>2</b><span data-t="st2"></span></button></li><li><button type="button" data-go="2"><b>3</b><span data-t="st3"></span></button></li><li><button type="button" data-go="3"><b>4</b><span data-t="st4"></span></button></li></ol><div class="bar" aria-hidden="true"><i></i></div><div class="barl" aria-live="polite"></div></nav>
<div class="draft" id="draftmsg" hidden><span data-t="draft"></span><button type="button" id="draft_x" data-t="draft_x"></button></div>

<section class="card" id="step0">
  <h2 data-i18n="s0"></h2>
  <p class="hint" data-i18n="s0h"></p>
  <div class="lookup"><input type="search" id="lk" data-i18n-ph="s0_ph" autocomplete="off"><button type="button" id="lkbtn" data-i18n="s0_btn"></button></div>
  <div class="hits" id="hits"></div>
  <div class="picked" id="picked"></div>
  <div class="lkmsg" id="lkmsg"></div>
  <div id="absents" hidden style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px">
    <b data-i18n="s0_abs_t"></b><p class="hint" data-i18n="s0_abs_h" style="margin:4px 0 8px"></p><div id="absents_list" style="display:grid;gap:6px"></div>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s1"></h2>
  <p class="hint" data-i18n="s1h"></p>
  <div class="grid">
    <div class="full"><label for="p_nom" class="req" data-i18n="nomprenom"></label><input type="text" id="p_nom" required autocomplete="name"></div>
    <div><label for="p_tel" class="req" data-i18n="gsm"></label><input type="tel" id="p_tel" required autocomplete="tel"></div>
    <div><label for="p_email" data-i18n="email"></label><input type="email" id="p_email" autocomplete="email"></div>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s2"></h2>
  <p class="hint" data-i18n="s2h"></p>
  <div id="societes"></div>
  <div class="adds"><button type="button" class="add" id="add_soc" data-i18n="add_soc"></button></div>
</section>

<section class="card">
  <h2 data-i18n="s3"></h2>
  <p class="hint" data-i18n="s3h"></p>
  <div id="magasins"></div>
  <div class="adds">
    <button type="button" class="add" id="add_mag_copy" data-i18n="add_mag_copy"></button>
    <button type="button" class="add" id="add_mag" data-i18n="add_mag"></button>
    <button type="button" class="add" id="add_soc_same" data-i18n="add_soc_same"></button>
    <p class="note" data-i18n="add_soc_same_h" style="margin:0"></p>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s4"></h2>
  <div class="grid">
    <div class="full"><label data-i18n="membre"></label>
      <div class="chips">
        <label><input type="radio" name="membre_acrb" value="Oui"><span data-i18n="m_oui"></span></label>
        <label><input type="radio" name="membre_acrb" value="Non, intéressé"><span data-i18n="m_int"></span></label>
        <label><input type="radio" name="membre_acrb" value="Non"><span data-i18n="m_non"></span></label>
        <label><input type="radio" name="membre_acrb" value="Je ne sais pas"><span data-i18n="m_nsp"></span></label>
      </div>
    </div>
    <div class="full"><label data-i18n="interets"></label>
      <div class="chips">
        <label><input type="checkbox" name="interets" value="Propreté et sécurité"><span data-i18n="i1"></span></label>
        <label><input type="checkbox" name="interets" value="Animations et fêtes"><span data-i18n="i2"></span></label>
        <label><input type="checkbox" name="interets" value="Visibilité en ligne"><span data-i18n="i3"></span></label>
        <label><input type="checkbox" name="interets" value="Stationnement et mobilité"><span data-i18n="i4"></span></label>
        <label><input type="checkbox" name="interets" value="Relations avec la commune"><span data-i18n="i5"></span></label>
        <label><input type="checkbox" name="interets" value="Achats groupés"><span data-i18n="i6"></span></label>
        <label><input type="checkbox" name="interets" value="Marketplace du quartier Nord"><span data-i18n="i7"></span></label>
      </div>
    </div>
    <div class="full"><label for="preoccupation" data-i18n="preoc"></label><textarea id="preoccupation" rows="2"></textarea></div>
    <div class="full"><label data-i18n="mk_q"></label><p class="hint latin" style="margin:0 0 6px" data-i18n="mk_h"></p>
      <div class="chips">
        <label><input type="radio" name="marketplace" value="oui"><span data-i18n="mk_oui"></span></label>
        <label><input type="radio" name="marketplace" value="peut_etre"><span data-i18n="mk_pe"></span></label>
        <label><input type="radio" name="marketplace" value="non"><span data-i18n="mk_non"></span></label>
      </div>
      <input type="text" id="mk_com" style="margin-top:8px" data-i18n-ph="mk_com">
    </div>
    <div class="full"><label for="remarques" data-i18n="remarques"></label><textarea id="remarques"></textarea></div>
  </div>
  <div class="consent"><input type="checkbox" id="consent_site"><label for="consent_site" data-i18n="consent_site"></label></div>
  <div class="consent"><input type="checkbox" id="consent_rgpd" required><label for="consent_rgpd" class="req" data-i18n="consent_rgpd"></label></div>
</section>

<button class="submit" id="btn" type="submit" data-i18n="submit"></button>
<div class="msg" id="msg"></div>
<div id="fiche_uc" style="margin-top:14px"></div>
</form>

<div class="card done" id="done" hidden>
  <h2 data-i18n="done_h"></h2>
  <p data-i18n="done_p"></p>
</div>
</div>

<template id="t_soc">
<div class="item soc">
  <div class="top"><h3><span class="n"></span><span data-i18n="soc"></span></h3><button type="button" class="rm" data-i18n="rm"></button></div>
  <div class="grid">
    <div class="full"><label class="req" data-i18n="denomination"></label><input type="text" data-k="denomination" required></div>
    <div><label data-i18n="bce"></label><input type="text" data-k="bce" inputmode="numeric"></div>
    <div><label data-i18n="forme"></label><select data-k="forme_juridique"><option value="" data-i18n="choose"></option><option value="SRL">SRL</option><option value="SA">SA</option><option value="SNC">SNC</option><option value="SCS">SCS</option><option value="Indépendant (personne physique)" data-i18n="indep"></option><option value="ASBL">ASBL</option><option value="Autre" data-i18n="autre"></option></select></div>
    <div class="full"><label data-i18n="siege"></label><input type="text" data-k="siege_social"></div>
  </div>
  <details>
    <summary data-i18n="soc_details"></summary>
    <div class="grid">
      <div class="full"><label data-i18n="gerant"></label><input type="text" data-k="gerant_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="gerant_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="gerant_email" data-i18n-ph="email"></div>
      <div class="full"><label data-i18n="gerant2"></label><input type="text" data-k="gerant2_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="gerant2_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="gerant2_email" data-i18n-ph="email"></div>
      <div class="full"><label data-i18n="proprio_soc"></label><input type="text" data-k="proprietaire_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="proprietaire_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="proprietaire_email" data-i18n-ph="email"></div>
    </div>
  </details>
</div>
</template>

<template id="t_mag">
<div class="item mag">
  <div class="top"><h3><span class="n"></span><span data-i18n="mag"></span></h3><button type="button" class="rm" data-i18n="rm"></button></div>
  <div class="grid">
    <div class="full"><label class="req" data-i18n="enseigne"></label><input type="text" data-k="enseigne" required autocomplete="organization"></div>
    <div><label class="req" data-i18n="rue"></label><select data-k="rue" required class="rue_sel">
      <option value="rue de Brabant">rue de Brabant</option>
      <option value="place Liedts">place Liedts</option>
      <option value="rue Quatrecht">rue Quatrecht</option>

/* ——— 1. Contrôles non bloquants ——— */
function okGsm(v){var d=dg(v);if(d.indexOf("0032")===0)d=d.slice(2);if(d.indexOf("32")===0)d="0"+d.slice(2);return /^04[5-9]\d{7}$/.test(d);}
function okMail(v){return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v).trim());}
function okBce(v){var d=dg(v);if(d.length===9)d="0"+d;if(d.length!==10)return false;return 97-(parseInt(d.slice(0,8),10)%97)===parseInt(d.slice(8),10);}
function okNum(v){return /^\d{1,4}\s*[a-zA-Z]?(\s*[-\/]\s*\d{1,4}\s*[a-zA-Z]?)?$/.test(String(v).trim());}
function rule(el){if(!el||!el.tagName||el.readOnly)return null;if(el.id==="p_tel"||el.dataset.chk==="gsm")return ["w_gsm",okGsm];if(el.type==="email")return ["w_email",okMail];
  if(el.dataset.k==="bce")return ["w_bce",okBce];if(el.dataset.k==="numero")return ["w_num",okNum];return null;}
function check(el){var r=rule(el);if(!r)return;var v=(el.value||"").trim(),w=el.nextElementSibling&&el.nextElementSibling.classList.contains("warn")?el.nextElementSibling:null;
  if(v&&!r[1](v)){if(!w){w=document.createElement("p");w.className="warn";w.setAttribute("role","status");el.insertAdjacentElement("afterend",w);}w.dataset.t=r[0];w.textContent=L(r[0]);}
  else if(w)w.remove();}

/* ——— 2. Étapes et progression ——— */
var steps=document.getElementById("steps");
function tgt(i){var s=qsa("section.card",f);if(i===0)return s[0];if(i===1)return document.getElementById("societes").closest("section");if(i===2)return document.getElementById("magasins").closest("section");
  var g=qs('#magasins [data-g="open"]');return g?g.closest(".full"):s[s.length-1];}
function filled(sel){var e=qs(sel,f);if(!e)return false;if(e.type==="checkbox")return e.checked;if(e.type==="file")return !!(e.files&&e.files.length);return !!(e.value||"").trim();}
function progress(){if(!steps)return;
  var grp=[["#p_nom","#p_tel"],['#societes [data-k="denomination"]','#societes [data-k="forme_juridique"]'],['#magasins [data-k="enseigne"]','#magasins [data-k="numero"]','#magasins [data-k="categorie"]','#magasins [data-k="articles"]'],
    ['#magasins [data-g="open"]','#magasins [data-g="close"]','#magasins [data-f="photo"]','#consent_rgpd']],tot=0,ok=0;
  grp.forEach(function(g,i){var n=0;g.forEach(function(s){tot++;if(filled(s)){ok++;n++;}});var b=qs('[data-go="'+i+'"]',steps);if(b)b.classList.toggle("ok",n===g.length);});
  var s0=document.getElementById("step0");document.body.classList.toggle("stk",!!s0&&s0.getBoundingClientRect().bottom<window.innerHeight*0.6);
  var pc=Math.round(ok*100/tot);qs(".bar i",steps).style.width=pc+"%";qs(".barl",steps).textContent=L("prog")+" "+pc+" %";
  var act=0;for(var i=3;i>=0;i--){var t=tgt(i);if(t&&t.getBoundingClientRect().top<window.innerHeight*0.35){act=i;break;}}
  qsa("[data-go]",steps).forEach(function(b){if(+b.dataset.go===act)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");});}
if(steps){steps.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(!b)return;var t=tgt(+b.dataset.go);if(!t)return;var y=t.getBoundingClientRect().top+window.pageYOffset-steps.offsetHeight-8;window.scrollTo({top:y,behavior:"smooth"});});
  var tk;var pl=function(){clearTimeout(tk);tk=setTimeout(progress,80);};window.addEventListener("scroll",pl,{passive:true});f.addEventListener("input",pl);f.addEventListener("change",pl);f.addEventListener("click",pl);}

/* ——— 3. Après un choix dans l'annuaire : aller droit à ce qui manque ——— */
function jumpMissing(){var miss=qsa("input,select,textarea",f).filter(function(e){return e.willValidate&&!e.checkValidity()&&e.type!=="checkbox"&&e.offsetParent!==null;});
  qsa(".need",f).forEach(function(e){e.classList.remove("need");});if(!miss.length)return;miss.forEach(function(e){e.classList.add("need");e.addEventListener("input",function o(){e.classList.remove("need");e.removeEventListener("input",o);});});
  var d=miss[0].closest("details");if(d)d.open=true;var lm=document.getElementById("lkmsg");if(lm)lm.textContent=L("missing");
  var t=miss[0].closest(".item")||miss[0].closest("div")||miss[0];setTimeout(function(){var y=t.getBoundingClientRect().top+window.pageYOffset-(steps?steps.offsetHeight:0)-12;window.scrollTo({top:y,behavior:"smooth"});},60);}
try{new MutationObserver(function(ms){if(ms.some(function(m){return m.addedNodes.length;}))setTimeout(function(){jumpMissing();progress();},30);}).observe(document.getElementById("picked"),{childList:true});}catch(e){}

<script>/* Liens « un clic » ACRB (demande de Karim du 23/11/2026) : sur chaque écran où quelqu'un doit agir,
   un toucher ouvre un courriel (ou un WhatsApp) déjà rédigé pour l'association. Tout ce qu'on sait déjà
   est rempli ; seul ce qui manque porte la marque « 🔴 À COMPLÉTER ».
   Adresse et numéro : réglage public acrb_reglages « contact_association » (repli : info@shoppingbrabant.be).
   Le lien WhatsApp n'apparaît que si un numéro officiel est renseigné.
   Usage :
     <span data-unclic="Sujet" data-uc-intro="Phrase" data-uc-champs='[["Nom",""],["Enseigne","X"]]' data-uc-label="Libellé"></span>
     ou UNCLIC.rendre(element, {sujet, intro, champs, label}) ; UNCLIC.lien(...) rend juste les URL. */
(function(){
  if(window.UNCLIC)return;
  var CFG={email:"info@shoppingbrabant.be",whatsapp:null},MARQUE="🔴 À COMPLÉTER",vus=[];
  var st=document.createElement("style");
  st.textContent='.uc{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;line-height:1.35}'+

    '.uc a.uc-m{color:#14233c;background:#fff}.uc a.uc-w{color:#fff;background:#1f9d55;border-color:#1f9d55}';
  (document.head||document.documentElement).appendChild(st);

    var l=[o.salut||"Bonjour,",""];if(o.intro)l.push(o.intro,"");
    (o.champs||[]).forEach(function(c){var v=c[1];l.push(c[0]+" : "+((v==null||String(v).trim()==="")?MARQUE:v));});
    if(o.texte){l.push("",o.texte);}

    var b=o.corps||corps(o),r={mail:"mailto:"+CFG.email+"?subject="+enc(o.sujet||"Demande à l'association")+"&body="+enc(b),wa:null,corps:b};

    return r;
  }
  function html(o){
    var r=lien(o);
    return '<span class="uc">'+(o.label?'<b>'+o.label+'</b>':'')+
      '<a class="uc-m" href="'+r.mail+'" data-aide="Ouvre votre messagerie avec un courriel déjà rédigé pour l’association. Complétez seulement ce qui est marqué 🔴, puis envoyez.">✉ Courriel</a>'+
      (r.wa?'<a class="uc-w" href="'+r.wa+'" target="_blank" rel="noopener" data-aide="Ouvre WhatsApp avec le message déjà rédigé pour l’association. Complétez ce qui est marqué 🔴, puis envoyez.">WhatsApp</a>':'')+'</span>';
  }
