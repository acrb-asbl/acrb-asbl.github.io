<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Brabant — Fiche commerçant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1d1b17; --muted:#6a655c; --line:#dcd7cc;
  --accent:#9b3a2a; --accent-fg:#ffffff; --err:#b42318; --field:#fbfaf7; --soft:#f7ebe8;
  --display:"Libre Franklin","Helvetica Neue",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);font-family:var(--body);padding:0 max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Source Sans 3",system-ui,sans-serif;font-size:17px}
html[dir=rtl] h1,html[dir=rtl] .card h2,html[dir=rtl] .done h2{font-family:"Noto Naskh Arabic",serif;font-weight:600}
/* arabe / ourdou : les champs se saisissent en caractères latins, de gauche à droite */
html[dir=rtl] input:not([type=checkbox]):not([type=radio]),html[dir=rtl] textarea,html[dir=rtl] select{direction:ltr;text-align:left;font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;unicode-bidi:plaintext}
html[dir=rtl] input::placeholder,html[dir=rtl] textarea::placeholder{direction:rtl;text-align:right;font-family:"Noto Naskh Arabic",sans-serif}
.latin{display:none;margin:-6px 0 14px;padding:10px 12px;background:var(--soft);border-left:4px solid var(--accent);font-size:15px}html[dir=rtl] .latin{display:block;border-left:0;border-right:4px solid var(--accent)}
.wrap{max-width:720px;margin:0 auto}
.langs{display:flex;flex-wrap:wrap;gap:6px;padding-top:16px}
.langs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
header{padding:24px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
html[dir=rtl] .eyebrow{letter-spacing:0}
h1{font:800 clamp(28px,5.5vw,38px)/1.12 var(--display);letter-spacing:-.02em;margin:8px 0 12px;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-top:18px}
.card h2{font:700 21px/1.2 var(--display);margin:0 0 4px}
.card .hint{color:var(--muted);font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.grid .full{grid-column:1/-1}
@media(max-width:560px){.grid{grid-template-columns:1fr} }
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
label small{font-weight:400;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=time],select,textarea{
  width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--fg);font:inherit}
input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.req::after{content:" *";color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:500;cursor:pointer;background:var(--field);margin:0}
.chips input{accent-color:var(--accent)}
.chips label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;font-size:14px}
.days span{font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:10px}
.consent input{margin-top:4px;accent-color:var(--accent);flex:none}
.consent label{font-weight:400;margin:0}
button{font:inherit;cursor:pointer}
.item{border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:14px;background:var(--field)}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.item .top h3{margin:0;font-size:16px}
.item .top .n{display:inline-block;background:var(--accent);color:var(--accent-fg);border-radius:999px;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;margin-inline-end:8px}
.rm{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.adds{display:grid;gap:8px;margin-top:14px}
.add{width:100%;padding:12px;border:1px dashed var(--accent);border-radius:8px;background:var(--soft);color:var(--accent);font-weight:600}
details{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
details .grid,details .days{margin-top:12px}
.sub{display:grid;gap:12px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.submit{width:100%;padding:14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:17px;margin-top:22px}
.submit[disabled]{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;display:none}
.msg.err{display:block;background:#fdeceb;color:var(--err)}
.done{text-align:center;padding:48px 24px}
.done h2{font:800 26px/1.15 var(--display);margin:0 0 10px}
.done p{color:var(--muted)}.done .ref{font-family:monospace;font-size:13px}
.hp{position:absolute;left:-9999px}.chk{display:flex;gap:8px;align-items:center;font-size:15px}.chk small{color:var(--muted)}
.lookup{display:flex;gap:8px;margin-top:10px}.lookup input{flex:1}.lookup button{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;white-space:nowrap}
.hits{display:grid;gap:6px;margin-top:10px}.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit}
.hit b{display:block;font-size:15px}.hit small{color:var(--muted)}.hit .pick{color:var(--accent);font-weight:600;white-space:nowrap}
.picked{display:grid;gap:6px;margin-top:10px}.picked div{padding:8px 12px;border-radius:8px;background:var(--soft);font-size:14px;display:flex;justify-content:space-between;gap:8px}.picked button{background:none;border:0;color:var(--err);font-weight:600}
.lkmsg{font-size:13px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="langs" id="langs" role="group" aria-label="Langue / Taal / Language / Dil / اللغة / زبان">
  <button type="button" data-lang="fr">Français</button>
  <button type="button" data-lang="nl">Nederlands</button>
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="tr">Türkçe</button>
  <button type="button" data-lang="ar">العربية</button>
  <button type="button" data-lang="ur">اردو</button>
</div>
<header>
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1 data-i18n="h1"></h1>
  <p data-i18n="intro"></p>
  <p class="latin" data-i18n="latin_hint"></p>
</header>

<form id="f" novalidate>
<input class="hp" type="text" name="website_url" id="website_url" tabindex="-1" autocomplete="off">

<section class="card" id="step0">
  <h2 data-i18n="s0"></h2>
  <p class="hint" data-i18n="s0h"></p>
  <div class="lookup"><input type="search" id="lk" data-i18n-ph="s0_ph" autocomplete="off"><button type="button" id="lkbtn" data-i18n="s0_btn"></button></div>
  <div class="hits" id="hits"></div>
  <div class="picked" id="picked"></div>
  <div class="lkmsg" id="lkmsg"></div>
  <div id="absents" hidden style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px">
    <b data-i18n="s0_abs_t"></b><p class="hint" data-i18n="s0_abs_h" style="margin:4px 0 8px"></p><div id="absents_list" style="display:grid;gap:6px"></div>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s1"></h2>
  <p class="hint" data-i18n="s1h"></p>
  <div class="grid">
    <div class="full"><label for="p_nom" class="req" data-i18n="nomprenom"></label><input type="text" id="p_nom" required autocomplete="name"></div>
    <div><label for="p_tel" class="req" data-i18n="gsm"></label><input type="tel" id="p_tel" required autocomplete="tel"></div>
    <div><label for="p_email" data-i18n="email"></label><input type="email" id="p_email" autocomplete="email"></div>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s2"></h2>
  <p class="hint" data-i18n="s2h"></p>
  <div id="societes"></div>
  <div class="adds"><button type="button" class="add" id="add_soc" data-i18n="add_soc"></button></div>
</section>

<section class="card">
  <h2 data-i18n="s3"></h2>
  <p class="hint" data-i18n="s3h"></p>
  <div id="magasins"></div>
  <div class="adds">
    <button type="button" class="add" id="add_mag_copy" data-i18n="add_mag_copy"></button>
    <button type="button" class="add" id="add_mag" data-i18n="add_mag"></button>
    <button type="button" class="add" id="add_soc_same" data-i18n="add_soc_same"></button>
    <p class="note" data-i18n="add_soc_same_h" style="margin:0"></p>
  </div>
</section>

<section class="card">
  <h2 data-i18n="s4"></h2>
  <div class="grid">
    <div class="full"><label data-i18n="membre"></label>
      <div class="chips">
        <label><input type="radio" name="membre_acrb" value="Oui"><span data-i18n="m_oui"></span></label>
        <label><input type="radio" name="membre_acrb" value="Non, intéressé"><span data-i18n="m_int"></span></label>
        <label><input type="radio" name="membre_acrb" value="Non"><span data-i18n="m_non"></span></label>
        <label><input type="radio" name="membre_acrb" value="Je ne sais pas"><span data-i18n="m_nsp"></span></label>
      </div>
    </div>
    <div class="full"><label data-i18n="interets"></label>
      <div class="chips">
        <label><input type="checkbox" name="interets" value="Propreté et sécurité"><span data-i18n="i1"></span></label>
        <label><input type="checkbox" name="interets" value="Animations et fêtes"><span data-i18n="i2"></span></label>
        <label><input type="checkbox" name="interets" value="Visibilité en ligne"><span data-i18n="i3"></span></label>
        <label><input type="checkbox" name="interets" value="Stationnement et mobilité"><span data-i18n="i4"></span></label>
        <label><input type="checkbox" name="interets" value="Relations avec la commune"><span data-i18n="i5"></span></label>
        <label><input type="checkbox" name="interets" value="Achats groupés"><span data-i18n="i6"></span></label>
      </div>
    </div>
    <div class="full"><label for="remarques" data-i18n="remarques"></label><textarea id="remarques"></textarea></div>
  </div>
  <div class="consent"><input type="checkbox" id="consent_site"><label for="consent_site" data-i18n="consent_site"></label></div>
  <div class="consent"><input type="checkbox" id="consent_rgpd" required><label for="consent_rgpd" class="req" data-i18n="consent_rgpd"></label></div>
</section>

<button class="submit" id="btn" type="submit" data-i18n="submit"></button>
<div class="msg" id="msg"></div>
</form>

<div class="card done" id="done" hidden>
  <h2 data-i18n="done_h"></h2>
  <p data-i18n="done_p"></p>
</div>
</div>

<template id="t_soc">
<div class="item soc">
  <div class="top"><h3><span class="n"></span><span data-i18n="soc"></span></h3><button type="button" class="rm" data-i18n="rm"></button></div>
  <div class="grid">
    <div class="full"><label class="req" data-i18n="denomination"></label><input type="text" data-k="denomination" required></div>
    <div><label data-i18n="bce"></label><input type="text" data-k="bce" inputmode="numeric"></div>
    <div><label data-i18n="forme"></label><select data-k="forme_juridique"><option value="" data-i18n="choose"></option><option value="SRL">SRL</option><option value="SA">SA</option><option value="SNC">SNC</option><option value="SCS">SCS</option><option value="Indépendant (personne physique)" data-i18n="indep"></option><option value="ASBL">ASBL</option><option value="Autre" data-i18n="autre"></option></select></div>
    <div class="full"><label data-i18n="siege"></label><input type="text" data-k="siege_social"></div>
  </div>
  <details>
    <summary data-i18n="soc_details"></summary>
    <div class="grid">
      <div class="full"><label data-i18n="gerant"></label><input type="text" data-k="gerant_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="gerant_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="gerant_email" data-i18n-ph="email"></div>
      <div class="full"><label data-i18n="gerant2"></label><input type="text" data-k="gerant2_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="gerant2_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="gerant2_email" data-i18n-ph="email"></div>
      <div class="full"><label data-i18n="proprio_soc"></label><input type="text" data-k="proprietaire_nom" data-i18n-ph="nomprenom"></div>
      <div><input type="tel" data-k="proprietaire_tel" data-i18n-ph="tel"></div>
      <div><input type="email" data-k="proprietaire_email" data-i18n-ph="email"></div>
    </div>
  </details>
</div>
</template>

<template id="t_mag">
<div class="item mag">
  <div class="top"><h3><span class="n"></span><span data-i18n="mag"></span></h3><button type="button" class="rm" data-i18n="rm"></button></div>
  <div class="grid">
    <div class="full"><label class="req" data-i18n="enseigne"></label><input type="text" data-k="enseigne" required autocomplete="organization"></div>
    <div><label class="req" data-i18n="rue"></label><select data-k="rue" required class="rue_sel">
      <option value="rue de Brabant">rue de Brabant</option>
      <option value="place Liedts">place Liedts</option>
      <option value="rue Quatrecht">rue Quatrecht</option>
      <option value="rue Allard">rue Allard</option>
      <option value="rue d'Hoogvorst">rue d'Hoogvorst</option>
      <option value="rue Gallait">rue Gallait</option>
      <option value="avenue de la Reine">avenue de la Reine</option>
      <option value="rue des Palais">rue des Palais</option>
      <option value="rue Rogier">rue Rogier</option>
      <option value="Autre" data-i18n="autre_rue"></option>
    </select><input type="text" data-k="rue_autre" class="rue_autre" data-i18n-ph="rue_autre_ph" hidden style="margin-top:8px"></div>
    <div><label class="req" data-i18n="numero"></label><input type="text" data-k="numero" required inputmode="numeric"></div>
    <div><label data-i18n="commune"></label><select data-k="commune"><option value="Schaerbeek (1030)">Schaerbeek (1030)</option><option value="Saint-Josse (1210)">Saint-Josse (1210)</option><option value="Bruxelles (1000)">Bruxelles (1000)</option></select></div>
    <div><label class="req" data-i18n="societe_de"></label><select data-k="societe" required class="soc_sel"></select></div>
    <div><label class="req" data-i18n="categorie"></label><select data-k="categorie" required>
      <option value="" data-i18n="choose"></option>
      <optgroup data-i18n-label="g_mode">
        <option value="Vêtements traditionnels / caftans" data-i18n="c1"></option>
        <option value="Robes de soirée / mariage" data-i18n="c2"></option>
        <option value="Prêt-à-porter" data-i18n="c3"></option>
        <option value="Vêtements enfants" data-i18n="c14"></option>
        <option value="Lingerie" data-i18n="c15"></option>
        <option value="Chaussures" data-i18n="c4"></option>
        <option value="Bijoux / accessoires" data-i18n="c5"></option>
        <option value="Sacs / bagagerie" data-i18n="c16"></option>
        <option value="Tissus / mercerie" data-i18n="c6"></option>
      </optgroup>
      <optgroup data-i18n-label="g_bouche">
        <option value="Boucherie" data-i18n="c17"></option>
        <option value="Volaille / rôtisserie" data-i18n="c18"></option>
        <option value="Poissonnerie" data-i18n="c19"></option>
        <option value="Boulangerie" data-i18n="c20"></option>
        <option value="Pâtisserie" data-i18n="c10"></option>
        <option value="Épicerie / supermarché" data-i18n="c8"></option>
        <option value="Fruits et légumes" data-i18n="c21"></option>
        <option value="Traiteur / plats à emporter" data-i18n="c22"></option>
        <option value="Restaurant / café / snack" data-i18n="c9"></option>
        <option value="Thé, café, épices, fruits secs" data-i18n="c23"></option>
      </optgroup>
      <optgroup data-i18n-label="g_maison">
        <option value="Maison / décoration" data-i18n="c12"></option>
        <option value="Textile de maison" data-i18n="c24"></option>
        <option value="Vaisselle / cadeaux" data-i18n="c25"></option>
        <option value="Bazar / discount" data-i18n="c26"></option>
      </optgroup>
      <optgroup data-i18n-label="g_beaute">
        <option value="Coiffure / barbier" data-i18n="c7"></option>
        <option value="Salon de beauté / esthétique" data-i18n="c27"></option>
        <option value="Parfumerie / cosmétiques" data-i18n="c28"></option>
        <option value="Pharmacie / optique" data-i18n="c29"></option>
      </optgroup>
      <optgroup data-i18n-label="g_services">
        <option value="Télécom / électronique" data-i18n="c11"></option>
        <option value="Agence (voyages, assurance, immobilier)" data-i18n="c13"></option>
        <option value="Banque / transfert d'argent" data-i18n="c30"></option>
        <option value="Nettoyage à sec / retouches" data-i18n="c31"></option>
      </optgroup>
      <option value="Autre" data-i18n="autre"></option>
    </select></div>
    <div class="full"><label class="req" data-i18n="articles"></label><input type="text" data-k="articles" required data-i18n-ph="articles_ph"></div>
    <div><label data-i18n="debut"></label><input type="text" data-k="debut_activite" inputmode="numeric" maxlength="4"></div>
    <div><label data-i18n="tel_mag"></label><input type="tel" data-k="tel"></div>
    <div class="full"><label data-i18n="email_mag"></label><input type="email" data-k="email"></div>
    <div class="full"><label data-i18n="description"></label><textarea data-k="description" data-i18n-ph="desc_ph"></textarea></div>
    <div class="full"><label data-i18n="langues"></label>
      <div class="chips">
        <label><input type="checkbox" data-l value="Français"><span data-i18n="L1"></span></label>
        <label><input type="checkbox" data-l value="Néerlandais"><span data-i18n="L2"></span></label>
        <label><input type="checkbox" data-l value="Anglais"><span data-i18n="L3"></span></label>
        <label><input type="checkbox" data-l value="Arabe"><span data-i18n="L4"></span></label>
        <label><input type="checkbox" data-l value="Turc"><span data-i18n="L5"></span></label>
        <label><input type="checkbox" data-l value="Ourdou"><span data-i18n="L6"></span></label>
        <label><input type="checkbox" data-l value="Espagnol"><span data-i18n="L7"></span></label>
      </div>
    </div>

    <div class="full"><label data-i18n="jours_ouv"></label>
      <div class="chips">
        <label><input type="checkbox" data-d="Lundi" checked><span data-i18n="d1"></span></label>
        <label><input type="checkbox" data-d="Mardi" checked><span data-i18n="d2"></span></label>
        <label><input type="checkbox" data-d="Mercredi" checked><span data-i18n="d3"></span></label>
        <label><input type="checkbox" data-d="Jeudi" checked><span data-i18n="d4"></span></label>
        <label><input type="checkbox" data-d="Vendredi" checked><span data-i18n="d5"></span></label>
        <label><input type="checkbox" data-d="Samedi" checked><span data-i18n="d6"></span></label>
        <label><input type="checkbox" data-d="Dimanche"><span data-i18n="d7"></span></label>
      </div>
    </div>
    <div class="full"><label data-i18n="horaires"></label>
      <div class="times">
        <div><label data-i18n="ouverture"></label><input type="time" data-g="open"></div>
        <div><label data-i18n="fermeture"></label><input type="time" data-g="close"></div>
      </div>
      <p class="note" data-i18n="horaires_h"></p>
      <details class="hdiff">
        <summary data-i18n="horaires_diff"></summary>
        <div class="days">
          <span data-i18n="d1"></span><input type="time" data-do="Lundi"><input type="time" data-dc="Lundi">

(function(){

  function translate(root){

    Array.prototype.forEach.call(root.querySelectorAll("[data-i18n-ph]"),function(el){var s=T[el.dataset.i18nPh];if(s!=null)el.placeholder=s;});

  }
  function setLang(l){
    if(!I18N[l]) l="fr";
    lang=l;T=I18N[l];
    document.documentElement.lang=l;
    document.documentElement.dir=(l==="ar"||l==="ur")?"rtl":"ltr";

    refreshSocSelects();
    try{localStorage.setItem("acrb_lang",l);}catch(e){}
  }
  document.getElementById("langs").addEventListener("click",function(e){var b=e.target.closest("button[data-lang]");if(b)setLang(b.dataset.lang);});

  function uid(){
    if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
    var b=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
    var h=Array.prototype.map.call(b,function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
    return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
  }
  function val(el){var s=(el&&el.value||"").trim();return s?s:null;}
  function fail(t){msg.className="msg err";msg.textContent=t;btn.disabled=false;btn.textContent=T.submit;}

  function renumber(box){
    Array.prototype.forEach.call(box.children,function(it,i){
      it.querySelector(".n").textContent=i+1;
      it.querySelector(".rm").hidden=(box.children.length===1);
    });
  }
  function refreshSocSelects(){
    var socs=Array.prototype.map.call(socBox.children,function(it,i){
      return {id:it.dataset.id, name:val(it.querySelector('[data-k="denomination"]'))||(T.soc+" "+(i+1))};
    });
    Array.prototype.forEach.call(magBox.querySelectorAll(".soc_sel"),function(sel){
      var cur=sel.value;
      sel.innerHTML='<option value="">'+T.choose+'</option>'+socs.map(function(s){return '<option value="'+s.id+'">'+s.name.replace(/</g,"&lt;")+'</option>';}).join("");
      sel.value=socs.some(function(s){return s.id===cur;})?cur:(socs.length===1?socs[0].id:"");
    });
  }
  function wireMag(node){
    var pn="p"+node.dataset.id.slice(0,8);
    var pbox=node.querySelector(".pbox");
    Array.prototype.forEach.call(node.querySelectorAll("[data-p]"),function(r){
      r.name=pn;
      r.addEventListener("change",function(){pbox.hidden=(r.value!=="Oui");});
    });
    var rue=node.querySelector(".rue_sel"), ra=node.querySelector(".rue_autre");
    rue.addEventListener("change",function(){ra.hidden=(rue.value!=="Autre");if(!ra.hidden)ra.focus();});
    function syncDays(force){
      var o=node.querySelector('[data-g="open"]').value, c=node.querySelector('[data-g="close"]').value;
      DAYS.forEach(function(d){
        var io=node.querySelector('[data-do="'+d+'"]'), ic=node.querySelector('[data-dc="'+d+'"]');
        if(force||!io.dataset.manual){io.value=o;delete io.dataset.manual;}
        if(force||!ic.dataset.manual){ic.value=c;delete ic.dataset.manual;}
      });
    }
    node.syncDays=syncDays;
    Array.prototype.forEach.call(node.querySelectorAll("[data-g]"),function(g){g.addEventListener("input",function(){syncDays(false);});});
    Array.prototype.forEach.call(node.querySelectorAll("[data-do],[data-dc]"),function(i){i.addEventListener("input",function(){i.dataset.manual="1";});});
    node.querySelector(".hdiff").addEventListener("toggle",function(){if(this.open)syncDays(false);});
  }
  function addItem(box, tplId){
    var node=document.getElementById(tplId).content.firstElementChild.cloneNode(true);
    node.dataset.id=uid();
    translate(node);
    if(tplId==="t_mag") wireMag(node);
    node.querySelector(".rm").addEventListener("click",function(){
      if(box.children.length>1){node.remove();renumber(box);refreshSocSelects();}
    });
    box.appendChild(node);renumber(box);refreshSocSelects();
    return node;
  }
  function copyMag(src){
    var node=addItem(magBox,"t_mag");
    var skip={numero:1,rue_autre:1};
    Array.prototype.forEach.call(src.querySelectorAll("[data-k]"),function(el){
      if(skip[el.dataset.k]) return;
      var dst=node.querySelector('[data-k="'+el.dataset.k+'"]');if(dst)dst.value=el.value;
    });
    ["data-k2","data-l","data-d","data-p"].forEach(function(a){
      Array.prototype.forEach.call(src.querySelectorAll("["+a+"]"),function(el){
        var dst=node.querySelector("["+a+'="'+el.getAttribute(a)+'"]');if(dst)dst.checked=el.checked;
      });
    });
    ["data-g","data-do","data-dc"].forEach(function(a){
      Array.prototype.forEach.call(src.querySelectorAll("["+a+"]"),function(el){
        var dst=node.querySelector("["+a+'="'+el.getAttribute(a)+'"]');if(dst){dst.value=el.value;if(el.dataset.manual)dst.dataset.manual="1";}
      });
    });
    node.querySelector(".pbox").hidden=!(src.querySelector('[data-p][value="Oui"]').checked);
    node.querySelector(".hdiff").open=src.querySelector(".hdiff").open;
    node.querySelector(".rue_autre").hidden=(node.querySelector(".rue_sel").value!=="Autre");
    var num=node.querySelector('[data-k="numero"]');num.focus();if(num.scrollIntoView)num.scrollIntoView({block:"center"});
    return node;
  }
  socBox.addEventListener("input",function(e){if(e.target.matches('[data-k="denomination"]'))refreshSocSelects();});
  document.getElementById("add_soc").addEventListener("click",function(){addItem(socBox,"t_soc").querySelector("input").focus();});
  document.getElementById("add_mag").addEventListener("click",function(){addItem(magBox,"t_mag").querySelector("input").focus();});
  document.getElementById("add_mag_copy").addEventListener("click",function(){copyMag(magBox.lastElementChild);});
  document.getElementById("add_soc_same").addEventListener("click",function(){
    var soc=addItem(socBox,"t_soc");
    var mag=copyMag(magBox.lastElementChild);
    mag.querySelector(".soc_sel").value=soc.dataset.id;
    var den=soc.querySelector('[data-k="denomination"]');den.focus();if(den.scrollIntoView)den.scrollIntoView({block:"center"});
  });

  /* ---- étape 0 : reprise depuis l'annuaire (acrb_bce) ---- */
  var lk=document.getElementById("lk"), hits=document.getElementById("hits"), picked=document.getElementById("picked"), lkmsg=document.getElementById("lkmsg");
  var PICKED={}, USED={soc:false,mag:false};
  var RUES={"RUE DE BRABANT":"rue de Brabant","PLACE LIEDTS":"place Liedts","RUE DE QUATRECHT":"rue Quatrecht","RUE ALLARD":"rue Allard","RUE D'HOOGVORST":"rue d'Hoogvorst","RUE GALLAIT":"rue Gallait","AVENUE DE LA REINE":"avenue de la Reine","RUE DES PALAIS":"rue des Palais","RUE ROGIER":"rue Rogier"};
  function formeOf(f){f=String(f||"");if(!f)return "";if(/responsabilit|SPRL|SRL|BV/i.test(f))return "SRL";if(/anonyme|^SA$|NV/i.test(f))return "SA";if(/nom collectif|SNC|VOF/i.test(f))return "SNC";if(/commandite|SCS|SComm|CommV/i.test(f))return "SCS";if(/sans but|ASBL|VZW/i.test(f))return "ASBL";if(/physique|natuur|indép/i.test(f))return "Indépendant (personne physique)";return "Autre";}
  function dotUe(u){var d=String(u||"").replace(/\D/g,"");return d.length===10?d[0]+"."+d.slice(1,4)+"."+d.slice(4,7)+"."+d.slice(7):u;}
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function sbGet(q){return fetch(SB+"/rest/v1/acrb_bce?"+q,{headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}

  function search(){
    var q=(lk.value||"").trim();if(q.length<2)return;
    hits.innerHTML="";lkmsg.textContent="…";
    var d=q.replace(/\D/g,""), parts;
    if(d.length>=6) parts="bce.ilike.*"+d.slice(0,4)+"*"+d.slice(4,7)+"*"+d.slice(7)+"*";
    else if(/^\d{1,4}[a-z]?$/i.test(q)) parts="numero.eq."+d;
    else {var t=q.replace(/[,()*]/g," ").replace(/\s+/g,"*");parts="enseigne.ilike.*"+t+"*,denomination.ilike.*"+t+"*";}
    sbGet("select=ue,bce,rue,numero,cp,enseigne,denomination,forme,ue_depuis,tel,email,web,fonctions,activites&masque=not.is.true&or=("+parts+")&order=rue,numero&limit=12").then(function(rows){
      lkmsg.textContent=rows.length?"":T.s0_none;
      hits.innerHTML=rows.map(function(r){return '<button type="button" class="hit" data-ue="'+esc(r.ue)+'"><span><b>'+esc(r.enseigne||r.denomination)+'</b><small>'+esc(r.denomination)+' · '+esc((RUES[r.rue]||r.rue)+" "+r.numero+", "+r.cp)+'</small></span><span class="pick">'+T.s0_pick+' →</span></button>';}).join("");
      hits._rows=rows;
    }).catch(function(){lkmsg.textContent=T.s0_err;});
  }
  lk.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();search();}});
  document.getElementById("lkbtn").addEventListener("click",search);
  hits.addEventListener("click",function(e){var b=e.target.closest(".hit");if(!b)return;var r=(hits._rows||[]).filter(function(x){return String(x.ue)===b.dataset.ue;})[0];if(r)prefill(r);hits.innerHTML="";lk.value="";});
  function setK(node,k,v){var el=node.querySelector('[data-k="'+k+'"]');if(el&&v!=null&&v!==""&&!el.value)el.value=v;}
  function prefill(r){
    var uk=String(r.ue).replace(/\D/g,"");if(PICKED[uk])return;PICKED[uk]=r;
    var bn=String(r.bce||"").replace(/\D/g,"");
    var soc=Array.prototype.filter.call(socBox.children,function(it){return (val(it.querySelector('[data-k="bce"]'))||"").replace(/\D/g,"")===bn&&bn;})[0];
    if(!soc){
      soc=(!USED.soc&&!val(socBox.firstElementChild.querySelector('[data-k="denomination"]')))?socBox.firstElementChild:addItem(socBox,"t_soc");
      USED.soc=true;
      setK(soc,"denomination",r.denomination);setK(soc,"bce",fmtBce(r.bce));
      var fo=soc.querySelector('[data-k="forme_juridique"]');if(fo&&!fo.value)fo.value=formeOf(r.forme);
      var g=(r.fonctions||[]).filter(function(x){return /g[ée]rant|administrateur|fondateur|zaakvoerder|bestuurder/i.test(x.role||"");});
      if(g[0])setK(soc,"gerant_nom",g[0].nom);if(g[1])setK(soc,"gerant2_nom",g[1].nom);
      refreshSocSelects();
    }
    var mag=(!USED.mag&&!val(magBox.firstElementChild.querySelector('[data-k="enseigne"]')))?magBox.firstElementChild:addItem(magBox,"t_mag");
    USED.mag=true;mag.dataset.ue=String(r.ue).replace(/\D/g,"");
    setK(mag,"enseigne",r.enseigne||r.denomination);
    var rs=mag.querySelector(".rue_sel");if(RUES[r.rue])rs.value=RUES[r.rue];else{rs.value="Autre";setK(mag,"rue_autre",r.rue);mag.querySelector(".rue_autre").hidden=false;}
    setK(mag,"numero",r.numero);
    var cm=mag.querySelector('[data-k="commune"]');if(r.cp==="1210")cm.value="Saint-Josse (1210)";else if(r.cp==="1000")cm.value="Bruxelles (1000)";
    mag.querySelector(".soc_sel").value=soc.dataset.id;
    setK(mag,"tel",r.tel);setK(mag,"email",r.email);setK(mag,"site_web",r.web);
    var y=(String(r.ue_depuis||"").match(/\d{4}/)||[])[0];setK(mag,"debut_activite",y);
    picked.insertAdjacentHTML("beforeend",'<div data-ue="'+esc(r.ue)+'"><span>✓ '+esc(r.enseigne||r.denomination)+' · '+esc((RUES[r.rue]||r.rue)+" "+r.numero)+'</span></div>');
    lkmsg.textContent=T.s0_done;
    sbGet("select=ue,enseigne,denomination,statut_v&masque=not.is.true&rue=eq."+encodeURIComponent(r.rue)+"&numero=eq."+r.numero+"&cp=eq."+r.cp+"&ue=neq."+encodeURIComponent(r.ue)).then(function(rows){rows=rows.filter(function(x){return !x.statut_v||x.statut_v==="ouvert";});if(!rows.length)return;
      var box=document.getElementById("absents");box.hidden=false;var list=document.getElementById("absents_list");
      list.insertAdjacentHTML("beforeend",rows.map(function(x){return '<label class="chk"><input type="checkbox" name="absent" value="'+esc(x.ue)+'" data-src="'+esc(uk)+'"> '+esc(x.enseigne||x.denomination)+' <small>('+esc(x.denomination)+')</small></label>';}).join(""));}).catch(function(){});
  }
  try{var ues=(new URLSearchParams(location.search).get("ue")||"").split(",").map(function(u){return u.replace(/\D/g,"");}).filter(Boolean);
    if(ues.length){sbGet("select=ue,bce,rue,numero,cp,enseigne,denomination,forme,ue_depuis,tel,email,web,fonctions,activites&ue=in.("+ues.map(function(u){return '"'+dotUe(u)+'"';}).join(",")+")").then(function(rows){rows.forEach(prefill);}).catch(function(){lkmsg.textContent=T.s0_err;});}
  }catch(e){}

  var initial="fr";
  try{initial=new URLSearchParams(location.search).get("lang")||localStorage.getItem("acrb_lang")||"fr";}catch(e){}
  setLang(initial);
  addItem(socBox,"t_soc"); addItem(magBox,"t_mag");

  function readKeys(it){
    var o={};
    Array.prototype.forEach.call(it.querySelectorAll("[data-k]"),function(el){o[el.dataset.k]=val(el);});
    Array.prototype.forEach.call(it.querySelectorAll("[data-k2]"),function(el){o[el.dataset.k2]=el.checked;});
    return o;
  }
  function hours(it){
    var o=it.querySelector('[data-g="open"]').value||null, c=it.querySelector('[data-g="close"]').value||null;
    var diff=it.querySelector(".hdiff").open;
    var json={}, lines=[], jours=[];
    DAYS.forEach(function(d){
      var on=it.querySelector('[data-d="'+d+'"]').checked;
      var io=it.querySelector('[data-do="'+d+'"]').value, ic=it.querySelector('[data-dc="'+d+'"]').value;
      var mo=it.querySelector('[data-do="'+d+'"]').dataset.manual, mc=it.querySelector('[data-dc="'+d+'"]').dataset.manual;
      var oo=(diff&&mo)?(io||null):o, cc=(diff&&mc)?(ic||null):c;
      if(on){jours.push(d);json[d]={ouvre:oo,ferme:cc};lines.push(d+" : "+((oo||cc)?((oo||"?")+" – "+(cc||"?")):"ouvert"));}
      else{json[d]=null;lines.push(d+" : fermé");}
    });
    return {json:json,text:lines.join("\n"),jours:jours};
  }
  function upload(file, prefix){
    if(!file) return Promise.resolve(null);
    if(file.size>8*1024*1024) return Promise.reject(new Error(T.err_photo));
    var ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var path=prefix+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
    return fetch(SB+"/storage/v1/object/acrb/"+path,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":file.type||"application/octet-stream"},body:file})
      .then(function(r){if(!r.ok) throw new Error(T.err_save+" ("+r.status+")");return SB+"/storage/v1/object/public/acrb/"+path;});
  }
  function insert(table, rows){
    return fetch(SB+"/rest/v1/"+table,{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(rows)})
      .then(function(r){if(!r.ok) return r.text().then(function(t){throw new Error(T.err_save+" ("+r.status+") "+t.slice(0,120));});});
  }

  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    msg.className="msg";
    if(document.getElementById("website_url").value) return;
    var bad=f.querySelector(":invalid");
    if(bad){
      var d=bad.closest("details");if(d)d.open=true;
      bad.focus();bad.scrollIntoView({block:"center"});
      return fail(T.err_req);
    }
    btn.disabled=true;btn.textContent=T.sending;

    var pid=uid();
    var personne={
      id:pid, nom:val(document.getElementById("p_nom")), tel:val(document.getElementById("p_tel")), email:val(document.getElementById("p_email")),
      membre_acrb:(f.querySelector('input[name="membre_acrb"]:checked')||{}).value||null,
      interets:Array.prototype.map.call(f.querySelectorAll('input[name="interets"]:checked'),function(e){return e.value;}),
      remarques:val(document.getElementById("remarques")),
      consent_site:document.getElementById("consent_site").checked, consent_rgpd:document.getElementById("consent_rgpd").checked,
      langue_formulaire:lang, user_agent:navigator.userAgent.slice(0,200)
    };
    var societes=Array.prototype.map.call(socBox.children,function(it){
      var o=readKeys(it);o.id=it.dataset.id;o.personne_id=pid;return o;
    });
    var uploads=[];
    var magasins=Array.prototype.map.call(magBox.children,function(it){
      var o=readKeys(it);
      o.id=it.dataset.id;o.personne_id=pid;o.societe_id=o.societe||null;delete o.societe;o.ue=it.dataset.ue||null;
      if(o.rue==="Autre") o.rue=o.rue_autre||"Autre"; delete o.rue_autre;
      o.code_postal=((o.commune||"").match(/\d{4}/)||[null])[0];
      o.langues=Array.prototype.map.call(it.querySelectorAll("[data-l]:checked"),function(e){return e.value;});
      var h=hours(it);o.horaires=h.text;o.horaires_json=h.json;o.jours_ouverture=h.jours;
      var pr=it.querySelector("[data-p]:checked");o.priere_vendredi=pr?pr.value:null;
      if(o.priere_vendredi!=="Oui"){o.priere_fermeture=null;o.priere_reouverture=null;o.priere_ete_decalage=null;}
      var logo=it.querySelector('[data-f="logo"]').files[0], photo=it.querySelector('[data-f="photo"]').files[0];
      uploads.push(upload(logo,"logos").then(function(u){o.logo_url=u;}));
      uploads.push(upload(photo,"facades").then(function(u){o.photo_url=u;}));
      return o;
    });

    Promise.all(uploads)
      .then(function(){return insert("acrb_personnes",[personne]);})
      .then(function(){return insert("acrb_societes",societes);})
      .then(function(){return insert("acrb_magasins",magasins);})
      .then(function(){return fetch(SB+"/rest/v1/rpc/acrb_soumettre",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_personne_id:pid,p_langue:lang,p_user_agent:navigator.userAgent.slice(0,200)})}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});})
      .then(function(j){var abs=Array.prototype.map.call(document.querySelectorAll('input[name="absent"]:checked'),function(c){return c;});
        if(abs.length){var bySrc={};abs.forEach(function(c){(bySrc[c.dataset.src]=bySrc[c.dataset.src]||[]).push(c.value);});
          Object.keys(bySrc).forEach(function(src){fetch(SB+"/rest/v1/rpc/acrb_declarer_absents",{method:"POST",headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_personne_id:pid,p_ue_source:src,p_ues:bySrc[src]})}).catch(function(){});});}
        return j;})
      .then(function(j){f.hidden=true;var d=document.getElementById("done");d.hidden=false;if(j&&j.journal_id){var r=document.createElement("p");r.className="ref";r.textContent=(T.done_ref||"Référence")+" : "+j.journal_id+" · "+j.empreinte.slice(0,12);d.appendChild(r);}window.scrollTo(0,0);})
      .catch(function(e){fail((e&&e.message)||T.err_generic);});
  });
})();
</script>
</body>
</html>
